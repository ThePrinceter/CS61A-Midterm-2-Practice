<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>CS 61A Midterm 2 Practice</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=JetBrains+Mono:wght@400;600&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F2F4F8; --surface:#FFFFFF; --surface2:#F7F8FB; --ink:#0F1B33; --muted:#566178; --line:#D8DEE9;
  --primary:#003262; --primary-ink:#FFFFFF; --gold:#FDB515; --gold-ink:#2E2100;
  --good:#17703F; --good-bg:#E4F3EA; --bad:#A92A22; --bad-bg:#FBE8E6; --warn-bg:#FFF4D6;
  --ed-bg:#0D1829; --ed-ink:#E6ECF7; --ed-line:#1F3050; --ed-muted:#6F82A3;
  --t-kw:#8DB6FF; --t-str:#9BE3B5; --t-num:#F5AA7C; --t-bi:#C9A9FF; --t-cm:#6F82A3;
  --font-ui:'Bricolage Grotesque','Segoe UI',system-ui,-apple-system,sans-serif;
  --font-read:'Source Serif 4',Georgia,'Times New Roman',serif;
  --font-code:'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#09101D; --surface:#111B2E; --surface2:#16223A; --ink:#E7ECF6; --muted:#97A4BC; --line:#24324E;
    --primary:#FDB515; --primary-ink:#1B1300; --gold:#FDB515; --gold-ink:#2E2100;
    --good:#58D18B; --good-bg:#10301F; --bad:#FF8C84; --bad-bg:#3A1714; --warn-bg:#3A2D08;
    --ed-bg:#060D18; --ed-line:#1B2A46; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#09101D; --surface:#111B2E; --surface2:#16223A; --ink:#E7ECF6; --muted:#97A4BC; --line:#24324E;
  --primary:#FDB515; --primary-ink:#1B1300; --gold:#FDB515; --gold-ink:#2E2100;
  --good:#58D18B; --good-bg:#10301F; --bad:#FF8C84; --bad-bg:#3A1714; --warn-bg:#3A2D08;
  --ed-bg:#060D18; --ed-line:#1B2A46; color-scheme:dark;
}
*{box-sizing:border-box}
html{height:100%;scroll-padding-top:calc(72px + env(safe-area-inset-top,0px))}
body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font-family:var(--font-ui);font-size:16px;line-height:1.5;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit}
a{color:inherit}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px;border-radius:4px}
code,pre,textarea{font-family:var(--font-code)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* top bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:var(--primary);color:var(--primary-ink);display:flex;align-items:center;gap:14px;padding:10px 18px}
:root[data-theme="dark"] .top, :root:not([data-theme="light"]) .top{}
.brand{font-weight:800;font-size:19px;letter-spacing:-.01em;text-decoration:none;display:flex;align-items:baseline;gap:8px;white-space:nowrap}
.brand small{font-weight:500;opacity:.8;font-size:13px}
.menu-btn{display:none;background:transparent;border:1.5px solid currentColor;border-radius:8px;padding:6px 10px;cursor:pointer;font-weight:700}
.spacer{flex:1}
.meter{display:flex;align-items:center;gap:10px;font-size:14px;font-weight:600;white-space:nowrap}
.meter .bar{width:140px;height:8px;border-radius:99px;background:rgba(255,255,255,.28);overflow:hidden}
:root[data-theme="dark"] .meter .bar{background:rgba(0,0,0,.25)}
.meter .bar i{display:block;height:100%;background:var(--gold);border-radius:99px;transition:width .4s}
:root[data-theme="dark"] .meter .bar i{background:#1B1300}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .meter .bar{background:rgba(0,0,0,.25)}:root:not([data-theme="light"]) .meter .bar i{background:#1B1300}}
.pill{border:1.5px solid currentColor;background:transparent;border-radius:99px;padding:5px 12px;font-size:13px;font-weight:700;cursor:pointer;white-space:nowrap}
.pill:hover{background:rgba(255,255,255,.14)}
#py-status[data-s="ready"]::before{content:"● ";color:#7CF0A8}
#py-status[data-s="loading"]::before{content:"● ";color:var(--gold)}
#py-status[data-s="error"]::before{content:"● ";color:#FF8C84}
:root[data-theme="dark"] #py-status[data-s="loading"]::before{color:#1B1300}

/* layout */
.shell{display:grid;grid-template-columns:292px minmax(0,1fr);align-items:start}
.side{position:sticky;top:calc(53px + env(safe-area-inset-top,0px));height:calc(100vh - 53px);overflow:auto;padding:18px 14px 40px 18px;border-right:1px solid var(--line);background:var(--surface)}
.seg{display:flex;background:var(--surface2);border:1px solid var(--line);border-radius:10px;padding:3px;margin-bottom:14px}
.seg button{flex:1;border:0;background:transparent;border-radius:8px;padding:7px 8px;font-weight:700;font-size:14px;cursor:pointer;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--primary);color:var(--primary-ink)}
.nav{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:2px}
.nav a{display:grid;grid-template-columns:1fr auto;gap:2px 10px;padding:8px 10px;border-radius:9px;text-decoration:none;font-weight:600;font-size:15px}
.nav a:hover{background:var(--surface2)}
.nav a[aria-current="page"]{background:var(--surface2);box-shadow:inset 3px 0 0 var(--gold)}
.nav .cnt{font-size:12.5px;color:var(--muted);font-variant-numeric:tabular-nums;align-self:center}
.nav .mini{grid-column:1/-1;height:3px;border-radius:9px;background:var(--line);overflow:hidden}
.nav .mini i{display:block;height:100%;background:var(--good)}
.nav a.full .cnt{color:var(--good);font-weight:700}
.home-link{display:block;margin-bottom:10px;padding:8px 10px;border-radius:9px;font-weight:700;text-decoration:none;font-size:15px}
.home-link:hover{background:var(--surface2)}
.main{padding:28px clamp(16px,4vw,48px) 90px;max-width:1040px;width:100%}

/* home */
.hero h1{font-size:clamp(34px,6vw,60px);line-height:1.02;letter-spacing:-.025em;font-weight:800;margin:0 0 14px;max-width:16ch}
.hero p{font-family:var(--font-read);font-size:19px;color:var(--muted);max-width:60ch;margin:0 0 22px}
.hero .hl{background:linear-gradient(transparent 62%,var(--gold) 62%,var(--gold) 92%,transparent 92%)}
.how{display:grid;grid-template-columns:repeat(3,1fr);gap:0;border-top:1px solid var(--line);border-bottom:1px solid var(--line);margin:26px 0 34px}
.how div{padding:16px 18px 16px 0}
.how div+div{padding-left:18px;border-left:1px solid var(--line)}
.how b{display:block;font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-bottom:4px}
.how span{font-family:var(--font-read);font-size:16.5px}
h2.sec{font-size:22px;margin:30px 0 10px;letter-spacing:-.01em}
.exam-list{list-style:none;margin:0;padding:0;border-top:1px solid var(--line)}
.exam-list li{border-bottom:1px solid var(--line)}
.exam-list a{display:grid;grid-template-columns:150px 1fr 110px;align-items:center;gap:14px;padding:12px 6px;text-decoration:none}
.exam-list a:hover{background:var(--surface)}
.exam-list .nm{font-weight:700;font-size:17px}
.exam-list .tp{color:var(--muted);font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.exam-list .pr{font-size:13.5px;text-align:right;color:var(--muted);font-variant-numeric:tabular-nums}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:6px 13px;font-weight:600;font-size:14.5px;text-decoration:none}
.chip:hover{border-color:var(--ink)}
.chip em{font-style:normal;color:var(--muted);font-size:13px}
.dot{width:9px;height:9px;border-radius:50%;display:inline-block;background:var(--c,#888)}

/* question */
.page-head{margin-bottom:6px}
.page-head h1{font-size:clamp(28px,4.5vw,44px);margin:0;letter-spacing:-.02em;font-weight:800;line-height:1.05}
.page-head p{margin:6px 0 0;color:var(--muted);font-family:var(--font-read);font-size:17px}
.topic-sec{margin-top:30px}
.topic-h{display:flex;align-items:center;gap:10px;font-size:13.5px;font-weight:800;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);margin:0 0 10px}
.topic-h::after{content:"";flex:1;height:1px;background:var(--line)}
.q{background:var(--surface);border:1px solid var(--line);border-radius:14px;margin:0 0 22px;overflow:hidden;border-left:6px solid var(--c,var(--line))}
.q[data-done="1"]{border-left-color:var(--good)}
.q-head{display:flex;gap:12px;align-items:flex-start;padding:16px 20px 4px}
.q-head h3{margin:0;font-size:21px;line-height:1.2;letter-spacing:-.01em;flex:1}
.q-head .meta{font-size:13px;color:var(--muted);font-weight:600;margin-bottom:3px;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.tag{display:inline-flex;align-items:center;gap:6px;padding:2px 9px;border-radius:99px;border:1px solid var(--line);background:var(--surface2);font-size:12.5px;font-weight:700;color:var(--ink);text-decoration:none}
.badge{font-size:13px;font-weight:800;padding:3px 10px;border-radius:99px;white-space:nowrap}
.badge.ok{background:var(--good-bg);color:var(--good)}
.badge.aplus{background:var(--warn-bg);color:var(--ink)}
.q-body{padding:6px 20px 20px}
.prose{font-family:var(--font-read);font-size:17.5px;line-height:1.6}
.prose p{margin:.6em 0}
.prose code{font-size:.84em;background:var(--surface2);border:1px solid var(--line);padding:1px 6px;border-radius:5px}
.prose ul{margin:.5em 0;padding-left:1.3em}
.codeblock{background:var(--ed-bg);color:var(--ed-ink);border-radius:10px;padding:12px 16px;overflow:auto;font-size:13.5px;line-height:1.55;margin:10px 0;border:1px solid var(--ed-line);white-space:pre;tab-size:4}
details.prov{margin:10px 0;border:1px dashed var(--line);border-radius:10px;background:var(--surface2)}
details.prov summary{cursor:pointer;padding:8px 14px;font-weight:700;font-size:14px;color:var(--muted)}
details.prov .codeblock{margin:0 10px 10px}

/* editor */
.ed-wrap{margin:12px 0 0;border-radius:12px;overflow:hidden;border:1px solid var(--ed-line);background:var(--ed-bg)}
.ed-bar{display:flex;align-items:center;gap:8px;padding:8px 12px;background:#14233D;color:#B6C4DE;font-size:13px;font-weight:600}
:root[data-theme="dark"] .ed-bar,:root:not([data-theme="light"]) .ed-bar{}
.ed-bar .sp{flex:1}
.ed-bar .hint{font-weight:500;opacity:.8;font-size:12.5px}
.ed{position:relative;background:var(--ed-bg)}
.ed pre,.ed textarea{margin:0;padding:14px 16px;font:400 14px/1.6 var(--font-code);letter-spacing:0;white-space:pre;tab-size:4;border:0;width:100%}
.ed pre{color:var(--ed-ink);min-height:96px;overflow:hidden;pointer-events:none;display:block}
.ed textarea{position:absolute;inset:0;height:100%;background:transparent;color:transparent;-webkit-text-fill-color:transparent;caret-color:#fff;resize:none;overflow-x:auto;overflow-y:hidden;outline:none}
.ed textarea::selection{background:rgba(141,182,255,.38);-webkit-text-fill-color:transparent}
.ed:focus-within{box-shadow:inset 0 0 0 2px var(--gold)}
.tk-kw{color:var(--t-kw);font-weight:600}.tk-str{color:var(--t-str)}.tk-num{color:var(--t-num)}.tk-bi{color:var(--t-bi)}.tk-cm{color:var(--t-cm);font-style:italic}
.tk-blank{background:rgba(253,181,21,.3);color:#FFE29A;border-radius:4px;box-shadow:0 0 0 1px rgba(253,181,21,.7)}
.actions{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-top:12px}
.btn{border:1.5px solid var(--ink);background:transparent;border-radius:10px;padding:8px 16px;font-weight:700;font-size:15px;cursor:pointer}
.btn:hover{background:var(--surface2)}
.btn.primary{background:var(--primary);border-color:var(--primary);color:var(--primary-ink)}
.btn.primary:hover{filter:brightness(1.12)}
.btn:disabled{opacity:.55;cursor:progress}
.btn.ghost{border-color:var(--line);color:var(--muted)}
.kbd{font-size:12.5px;color:var(--muted)}
.res{margin-top:12px}
.banner{padding:11px 16px;border-radius:10px;font-weight:700;display:flex;gap:10px;align-items:center}
.banner.good{background:var(--good-bg);color:var(--good)}
.banner.bad{background:var(--bad-bg);color:var(--bad)}
.banner.info{background:var(--warn-bg);color:var(--ink)}
.cases{list-style:none;margin:10px 0 0;padding:0;display:flex;flex-direction:column;gap:8px}
.case{border:1px solid var(--line);border-radius:10px;padding:9px 12px;background:var(--surface2)}
.case.pass{border-color:color-mix(in srgb,var(--good) 45%,var(--line))}
.case.fail{border-color:var(--bad);background:var(--bad-bg)}
.case .row{display:flex;gap:10px;align-items:flex-start}
.case .ic{font-weight:800;width:20px;flex:none}
.case.pass .ic{color:var(--good)}.case.fail .ic{color:var(--bad)}
.case pre{margin:0;font:13.5px/1.5 var(--font-code);white-space:pre-wrap;word-break:break-word}
.case .pre-st{color:var(--muted)}
.cmp{display:grid;grid-template-columns:auto 1fr;gap:2px 12px;margin:8px 0 0 30px;font:13.5px/1.5 var(--font-code)}
.cmp b{font-family:var(--font-ui);font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);padding-top:2px}
.errbox{margin-top:10px;background:var(--ed-bg);color:#FFB4AD;border-radius:10px;padding:12px 16px;font:13.5px/1.5 var(--font-code);white-space:pre-wrap}

/* wwpd / mc / classify */
.tbl{width:100%;border-collapse:collapse;margin-top:12px}
.tbl th{text-align:left;font-size:12.5px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);padding:6px 8px;border-bottom:2px solid var(--line)}
.tbl td{padding:8px;border-bottom:1px solid var(--line);vertical-align:top}
.tbl td.ex{font:13.5px/1.5 var(--font-code);white-space:pre-wrap;word-break:break-word;width:46%}
.tbl td.ex.given{color:var(--muted)}
.tbl td.ex.askq{font-family:var(--font-read);font-size:16px;white-space:normal}
.tbl textarea{width:100%;min-height:40px;border:1.5px solid var(--line);border-radius:8px;padding:8px 10px;font:14px/1.5 var(--font-code);background:var(--surface);color:var(--ink);resize:vertical}
.tbl textarea:focus{border-color:var(--ink);outline:none;box-shadow:0 0 0 3px var(--gold)}
.tbl tr.ok textarea{border-color:var(--good);background:var(--good-bg)}
.tbl tr.no textarea{border-color:var(--bad);background:var(--bad-bg)}
.tbl .fb{font-size:13.5px;margin-top:4px;font-weight:600}
.tbl tr.ok .fb{color:var(--good)}.tbl tr.no .fb{color:var(--bad)}
.tbl .ans{font:13.5px var(--font-code);white-space:pre-wrap}
.choices{list-style:none;margin:12px 0 0;padding:0;display:flex;flex-direction:column;gap:8px}
.choice{display:flex;gap:12px;align-items:flex-start;border:1.5px solid var(--line);border-radius:10px;padding:10px 14px;cursor:pointer;background:var(--surface);font-family:var(--font-read);font-size:17px}
.choice:hover{border-color:var(--ink)}
.choice input{margin-top:6px;accent-color:var(--primary);width:17px;height:17px;flex:none}
.choice.ok{border-color:var(--good);background:var(--good-bg)}
.choice.no{border-color:var(--bad);background:var(--bad-bg)}
.choice.miss{border-style:dashed;border-color:var(--good)}
.explain{margin-top:12px;padding:12px 16px;border-radius:10px;background:var(--surface2);border:1px solid var(--line);font-family:var(--font-read);font-size:16.5px}
.cls{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 14px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
.cls code{font-size:13.5px;white-space:pre-wrap;word-break:break-word}
.cls .opts{display:flex;gap:6px}
.cls .opts button{border:1.5px solid var(--line);background:var(--surface);border-radius:8px;padding:4px 12px;font-weight:700;cursor:pointer;min-width:46px}
.cls .opts button[aria-pressed="true"]{background:var(--primary);color:var(--primary-ink);border-color:var(--primary)}
.cls.ok .opts button[aria-pressed="true"]{background:var(--good);border-color:var(--good);color:#fff}
.cls.no .opts button[aria-pressed="true"]{background:var(--bad);border-color:var(--bad);color:#fff}
.cls .why{grid-column:1/-1;font-family:var(--font-read);font-size:15px;color:var(--muted)}
.empty{padding:40px 0;color:var(--muted);font-family:var(--font-read);font-size:18px}
.search{background:rgba(255,255,255,.16);border:1.5px solid rgba(255,255,255,.4);color:inherit;border-radius:99px;padding:6px 14px;font:inherit;font-size:14px;width:190px}
.search::placeholder{color:inherit;opacity:.7}
:root[data-theme="dark"] .search{background:rgba(0,0,0,.2);border-color:rgba(0,0,0,.45)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .search{background:rgba(0,0,0,.2);border-color:rgba(0,0,0,.45)}}

@media (max-width:900px){
  .shell{display:block}
  .menu-btn{display:inline-block}
  .side{position:fixed;inset:0 auto 0 0;z-index:40;width:min(330px,88vw);height:100%;transform:translateX(-102%);transition:transform .22s;padding-top:calc(18px + env(safe-area-inset-top,0px));box-shadow:0 0 40px rgba(0,0,0,.35)}
  .side.open{transform:none}
  .scrim{position:fixed;inset:0;background:rgba(5,10,20,.5);z-index:35;display:none}
  .scrim.on{display:block}
  .meter .bar,.search{display:none}
  .how{grid-template-columns:1fr}.how div+div{border-left:0;border-top:1px solid var(--line);padding-left:0}
  .exam-list a{grid-template-columns:1fr auto}.exam-list .tp{display:none}
  .tbl td.ex{width:auto}
  .tbl,.tbl tbody,.tbl tr,.tbl td{display:block;width:100%}
  .tbl thead{display:none}
  .q-body{padding:6px 14px 16px}.q-head{padding:14px 14px 4px}
  .brand small{display:none}
}
@media (max-width:520px){#py-status{font-size:0;padding:5px 9px}#py-status::before{font-size:14px}.top{gap:8px;padding:8px 12px}.brand{font-size:17px}}
@media (prefers-reduced-motion: reduce){*{transition:none!important}}
</style>
</head>
<body>
<header class="top">
  <button class="menu-btn" id="menu-btn" aria-label="Open navigation" aria-expanded="false">Menu</button>
  <a class="brand" href="#/">CS 61A <small>Midterm 2 practice</small></a>
  <span class="spacer"></span>
  <input class="search" id="search" type="search" placeholder="Search questions" aria-label="Search questions">
  <div class="meter" id="meter" aria-live="polite"></div>
  <span class="pill" id="py-status" data-s="loading" title="In-browser Python">Python</span>
  <button class="pill" id="theme-btn" aria-label="Toggle dark mode">Theme</button>
</header>
<div class="shell">
  <aside class="side" id="side" aria-label="Navigation">
    <a class="home-link" href="#/">Overview</a>
    <div class="seg" role="group" aria-label="Browse by">
      <button id="seg-exam" aria-pressed="true">By exam</button>
      <button id="seg-topic" aria-pressed="false">By topic</button>
    </div>
    <ul class="nav" id="nav"></ul>
  </aside>
  <main class="main" id="main" tabindex="-1"></main>

<script type="application/json" id="data">{"exams": [{"id": "sp26", "name": "Spring 2026", "order": 0}, {"id": "fa25", "name": "Fall 2025", "order": 1}, {"id": "sp25", "name": "Spring 2025", "order": 2}, {"id": "fa24", "name": "Fall 2024", "order": 3}, {"id": "sp24", "name": "Spring 2024", "order": 4}, {"id": "fa23", "name": "Fall 2023", "order": 5}, {"id": "sp23", "name": "Spring 2023", "order": 6}, {"id": "fa22", "name": "Fall 2022", "order": 7}, {"id": "sp22", "name": "Spring 2022", "order": 8}, {"id": "fa21", "name": "Fall 2021", "order": 9}, {"id": "su21", "name": "Summer 2021", "order": 10}, {"id": "sp21", "name": "Spring 2021", "order": 11}, {"id": "fa20", "name": "Fall 2020", "order": 12}, {"id": "fa19", "name": "Fall 2019", "order": 13}, {"id": "sp19", "name": "Spring 2019", "order": 14}, {"id": "fa18", "name": "Fall 2018", "order": 15}, {"id": "sp18", "name": "Spring 2018", "order": 16}, {"id": "fa17", "name": "Fall 2017", "order": 17}, {"id": "sp17", "name": "Spring 2017", "order": 18}, {"id": "fa16", "name": "Fall 2016", "order": 19}, {"id": "sp16", "name": "Spring 2016", "order": 20}, {"id": "fa15", "name": "Fall 2015", "order": 21}, {"id": "su15", "name": "Summer 2015", "order": 22}, {"id": "sp15", "name": "Spring 2015", "order": 23}, {"id": "fa14", "name": "Fall 2014", "order": 24}], "questions": [{"id": "fa14-1", "exam": "fa14", "n": "1", "topic": "Inheritance", "title": "Class Hierarchy", "kind": "wwpd", "points": 12, "prompt": "Write the output displayed by the interpreter for each expression (`Error` if it errors; include lines displayed before an error). Expressions are evaluated in order and may affect later expressions.", "code": "class Worker:\n    greeting = 'Sir'\n    def __init__(self):\n        self.elf = Worker\n    def work(self):\n        return self.greeting + ', I work'\n    def __repr__(self):\n        return Bourgeoisie.greeting\n\nclass Bourgeoisie(Worker):\n    greeting = 'Peon'\n    def work(self):\n        print(Worker.work(self))\n        return 'My job is to gather wealth'\n\nclass Proletariat(Worker):\n    greeting = 'Comrade'\n    def work(self, other):\n        other.greeting = self.greeting + ' ' + other.greeting\n        other.work()  # for revolution\n        return other\n\njack = Worker()\njohn = Bourgeoisie()\njack.greeting = 'Maam'\n", "setup": "", "rows": [{"label": "john.work()[10:]", "given": false, "answer": "Peon, I work\n'to gather wealth'"}, {"label": "Worker().work()", "given": false, "answer": "'Sir, I work'"}, {"label": "Proletariat().work(john)", "given": false, "answer": "Comrade Peon, I work\nPeon"}, {"label": "jack", "given": false, "answer": "Peon"}, {"label": "john.elf.work(john)", "given": false, "answer": "'Comrade Peon, I work'"}, {"label": "jack.work()", "given": false, "answer": "'Maam, I work'"}]}, {"id": "fa14-3a", "exam": "fa14", "n": "3a", "topic": "Linked Lists", "title": "This One Goes to Eleven: sixty_ones", "kind": "code", "points": 4, "prompt": "Implement `sixty_ones`, which takes a `Link` of integers and returns the number of times that `1` directly follows `6`.", "setup": "class Link:\n    empty = ()\n    def __init__(self, first, rest=empty):\n        assert rest is Link.empty or isinstance(rest, Link)\n        self.first = first\n        self.rest = rest\n    def __repr__(self):\n        if self.rest is not Link.empty:\n            rest_repr = ', ' + repr(self.rest)\n        else:\n            rest_repr = ''\n        return 'Link(' + repr(self.first) + rest_repr + ')'\n    def __str__(self):\n        string = '<'\n        while self.rest is not Link.empty:\n            string += str(self.first) + ' '\n            self = self.rest\n        return string + str(self.first) + '>'\n", "starter": "def sixty_ones(s):\n    if ___:\n        return 0\n    elif ___:\n        return 1 + ___\n    else:\n        return ___\n", "solution": "def sixty_ones(s):\n    if s is Link.empty or s.rest is Link.empty:\n        return 0\n    elif s.first == 6 and s.rest.first == 1:\n        return 1 + sixty_ones(s.rest)\n    else:\n        return sixty_ones(s.rest)\n", "tests": [{"s": "once = Link(4, Link(6, Link(1, Link(6, Link(0, Link(1))))))\ntwice = Link(1, Link(6, Link(1, once)))\nthrice = Link(6, twice)", "e": "[sixty_ones(x) for x in [Link.empty, once, twice, thrice]]", "x": "[0, 1, 2, 3]"}, {"s": "", "e": "sixty_ones(Link(6))", "x": "0"}], "note": ""}, {"id": "fa14-3b", "exam": "fa14", "n": "3b", "topic": "Recursion", "title": "This One Goes to Eleven: no_eleven", "kind": "code", "points": 4, "prompt": "Implement `no_eleven`, which returns a list of all distinct length-`n` lists of 1s and 6s in which **a 1 never directly follows a 1**.", "setup": "", "starter": "def no_eleven(n):\n    if n == 0:\n        return ___\n    elif n == 1:\n        return ___\n    else:\n        a, b = no_eleven(___), no_eleven(___)\n        return [___ for s in a] + [___ for s in b]\n", "solution": "def no_eleven(n):\n    if n == 0:\n        return [[]]\n    elif n == 1:\n        return [[6], [1]]\n    else:\n        a, b = no_eleven(n - 1), no_eleven(n - 2)\n        return [[6] + s for s in a] + [[1, 6] + s for s in b]\n", "tests": [{"s": "", "e": "no_eleven(2)", "x": "[[6, 6], [6, 1], [1, 6]]"}, {"s": "", "e": "no_eleven(3)", "x": "[[6, 6, 6], [6, 6, 1], [6, 1, 6], [1, 6, 6], [1, 6, 1]]"}, {"s": "", "e": "no_eleven(4)[:4]", "x": "[[6, 6, 6, 6], [6, 6, 6, 1], [6, 6, 1, 6], [6, 1, 6, 6]]"}, {"s": "", "e": "no_eleven(4)[4:]", "x": "[[6, 1, 6, 1], [1, 6, 6, 6], [1, 6, 6, 1], [1, 6, 1, 6]]"}], "note": ""}, {"id": "fa14-4a", "exam": "fa14", "n": "4a", "topic": "Trees", "title": "Tree Time: GrootTree", "kind": "code", "points": 4, "prompt": "A `GrootTree` is a binary tree with an attribute `parent`: the `GrootTree` in which it is a branch, or `BinaryTree.empty` if it is not a branch of any other. `BinaryTree.empty` must **not** have a `parent` attribute. Assume every `GrootTree` is a branch of at most one other tree. Fill in the constructor so `parent` is set correctly for the new tree **and its branches**. (`fib_groot` is provided.)", "setup": "class BinaryTree:\n    class EmptyTree:\n        is_empty = True\n    empty = EmptyTree()\n    is_empty = False\n    def __init__(self, entry, left=empty, right=empty):\n        self.entry = entry\n        self.left = left\n        self.right = right\ndef fib_groot(n):\n    \"\"\"Return a Fibonacci GrootTree.\"\"\"\n    if n == 0 or n == 1:\n        return GrootTree(n)\n    else:\n        left, right = fib_groot(n-2), fib_groot(n-1)\n        return GrootTree(left.entry + right.entry, left, right)\n", "starter": "class GrootTree(BinaryTree):\n    \"\"\"A binary tree with a parent.\"\"\"\n    def __init__(self, entry, left=BinaryTree.empty, right=BinaryTree.empty):\n        BinaryTree.__init__(self, entry, left, right)\n        ___\n        ___\n        ___\n        ___\n", "solution": "class GrootTree(BinaryTree):\n    def __init__(self, entry, left=BinaryTree.empty, right=BinaryTree.empty):\n        BinaryTree.__init__(self, entry, left, right)\n        self.parent = BinaryTree.empty\n        if left is not BinaryTree.empty:\n            left.parent = self\n        if right is not BinaryTree.empty:\n            right.parent = self\n", "tests": [{"s": "t = fib_groot(3)", "e": "t.entry", "x": "2"}, {"s": "", "e": "t.parent.is_empty", "x": "True"}, {"s": "", "e": "t.left.parent.entry", "x": "2"}, {"s": "", "e": "t.right.left.parent.right.parent.entry", "x": "1"}, {"s": "", "e": "hasattr(BinaryTree.empty, 'parent')", "x": "False"}], "note": ""}, {"id": "fa14-4b", "exam": "fa14", "n": "4b", "topic": "Trees", "title": "Tree Time: paths", "kind": "code", "points": 4, "prompt": "Implement `paths(g, s)`, which takes a `GrootTree` `g` and a non-empty list `s` and returns the **number of paths** through `g` whose entries are the elements of `s`. A path through a `GrootTree` can extend either to a branch **or to its parent**. (`GrootTree` and `fib_groot` are provided.)", "setup": "class BinaryTree:\n    class EmptyTree:\n        is_empty = True\n    empty = EmptyTree()\n    is_empty = False\n    def __init__(self, entry, left=empty, right=empty):\n        self.entry = entry\n        self.left = left\n        self.right = right\nclass GrootTree(BinaryTree):\n    def __init__(self, entry, left=BinaryTree.empty, right=BinaryTree.empty):\n        BinaryTree.__init__(self, entry, left, right)\n        self.parent = BinaryTree.empty\n        if left is not BinaryTree.empty:\n            left.parent = self\n        if right is not BinaryTree.empty:\n            right.parent = self\ndef fib_groot(n):\n    \"\"\"Return a Fibonacci GrootTree.\"\"\"\n    if n == 0 or n == 1:\n        return GrootTree(n)\n    else:\n        left, right = fib_groot(n-2), fib_groot(n-1)\n        return GrootTree(left.entry + right.entry, left, right)\n", "starter": "def paths(g, s):\n    if g is BinaryTree.empty or ___:\n        return 0\n    elif ___:\n        return 1\n    else:\n        xs = [___]\n        return sum([___ for x in xs])\n", "solution": "def paths(g, s):\n    if g is BinaryTree.empty or g.entry != s[0]:\n        return 0\n    elif len(s) == 1:\n        return 1\n    else:\n        xs = [g.left, g.right, g.parent]\n        return sum([paths(x, s[1:]) for x in xs])\n", "tests": [{"s": "t = fib_groot(3)", "e": "paths(t, [1])", "x": "0"}, {"s": "", "e": "paths(t, [2])", "x": "1"}, {"s": "", "e": "paths(t, [2, 1, 2, 1, 0])", "x": "2"}, {"s": "", "e": "paths(t, [2, 1, 0, 1, 0])", "x": "1"}, {"s": "", "e": "paths(t, [2, 1, 2, 1, 2, 1])", "x": "8"}], "note": ""}, {"id": "fa14-5a", "exam": "fa14", "n": "5a", "topic": "Data Abstraction", "title": "Abstraction and Growth: slinky", "kind": "code", "points": 6, "prompt": "A **slinky** is an abstract sequence that uses a `transition` function to compute each element from the previous element. It explicitly stores only the elements that **cannot** be computed by calling `transition` on the previous element, in a `starts` dictionary (index to element). Implement the constructor `slinky` and the selector-based function `get`. (The accessors `length`, `starts`, and `transition` are provided.)", "setup": "def length(slinky):\n    return slinky[0]\n\ndef starts(slinky):\n    return slinky[1]\n\ndef transition(slinky):\n    return slinky[2]\n", "starter": "def slinky(elements, transition):\n    starts = {}\n    for index in ___:\n        if ___:\n            starts[index] = elements[index]\n    return [len(elements), starts, transition]\n\ndef get(slinky, index):\n    \"\"\"Return the element at index of slinky.\"\"\"\n    if index in starts(slinky):\n        return starts(slinky)[index]\n    start = index\n    while ___:\n        start = start - 1\n    value = starts(slinky)[start]\n    while start < index:\n        value = ___\n        start = start + 1\n    return value\n", "solution": "def slinky(elements, transition):\n    starts = {}\n    for index in range(len(elements)):\n        if index == 0 or elements[index] != transition(elements[index - 1]):\n            starts[index] = elements[index]\n    return [len(elements), starts, transition]\n\ndef get(slinky, index):\n    if index in starts(slinky):\n        return starts(slinky)[index]\n    start = index\n    while start not in starts(slinky):\n        start = start - 1\n    value = starts(slinky)[start]\n    while start < index:\n        value = transition(slinky)(value)\n        start = start + 1\n    return value\n", "tests": [{"s": "t = slinky([2, 4, 10, 20, 40], lambda x: 2 * x)", "e": "starts(t)", "x": "{0: 2, 2: 10}"}, {"s": "", "e": "get(t, 3)", "x": "20"}, {"s": "", "e": "get(t, 4)", "x": "40"}, {"s": "r = slinky(range(3, 10), lambda x: x + 1)", "e": "length(r)", "x": "7"}, {"s": "", "e": "starts(r)", "x": "{0: 3}"}, {"s": "", "e": "get(r, 2)", "x": "5"}, {"s": "", "e": "slinky([], abs)[:2]", "x": "[0, {}]"}, {"s": "", "e": "slinky([5, 4, 3], abs)[:2]", "x": "[3, {0: 5, 1: 4, 2: 3}]"}], "note": ""}, {"id": "fa14-5b", "exam": "fa14", "n": "5b", "topic": "Orders of Growth", "title": "Abstraction and Growth: construction cost", "kind": "mc", "points": 2, "prompt": "For the `slinky` constructor you just wrote, what describes the number of operations required to compute `slinky(elements, transition)`, where `n` is the length of `elements`, assuming `transition` takes constant time and dictionary updates, list indexing, and `len` on a list are constant time?", "choices": ["Θ(1)", "Θ(n)", "Θ(d)", "Θ(n²)", "Θ(d²)", "Θ(n · d)"], "answer": [1], "multi": false, "explain": "There is one loop iteration per element, each doing a constant amount of work. (`d`, the number of stored starts, only affects the size of the output, not the number of iterations.)", "code": ""}, {"id": "fa15-1", "exam": "fa15", "n": "1", "topic": "Object-Oriented Programming", "title": "ok --submit", "kind": "wwpd", "points": 12, "prompt": "Write the output displayed by the interpreter for each expression (`Error` for errors, `Forever` if it would run forever). If more than 3 lines are displayed, just write the first 3. Expressions run in order and have a cumulative effect.", "code": "class Ok:\n    py = [3.14]\n    def __init__(self, py):\n        self.ok = self.py\n        Ok.py.append(3 * py)\n    def my(self, eye):\n        print(self.my(eye))\n        return self.ok.pop()\n    def __str__(self):\n        return str(self.ok)[:4]\n\nclass Go(Ok):\n    def my(self, help):\n        return [help + 3, len(Ok.py)]\n\noh = Go(5)\nGo.py = [3, 1, 4]\noh.no = {'just': Go(9)}\n", "setup": "", "rows": [{"label": "oh.py", "given": false, "answer": "[3, 1, 4]"}, {"label": "oh.my(3)", "given": false, "answer": "[6, 3]"}, {"label": "oh.ok + oh.no['just'].ok", "given": false, "answer": "[3.14, 15, 27, 3, 1, 4]"}, {"label": "print(oh)", "given": false, "answer": "[3.1"}, {"label": "Ok('go').my(5)", "given": false, "answer": "Error"}, {"label": "Ok.my(oh, 5)", "given": false, "answer": "[8, 4]\n'gogogo'"}]}, {"id": "fa15-3a", "exam": "fa15", "n": "3a", "topic": "Trees", "title": "Return of the Digits: complete", "kind": "code", "points": 4, "prompt": "A tree is **d-k-complete** if every node at a depth less than `d` has exactly `k` branches and every node at depth `d` is a leaf. The depth of the root is 0. Implement `complete(t, d, k)`, which returns whether `t` is d-k-complete.", "setup": "class Tree:\n    def __init__(self, label, branches=[]):\n        for b in branches:\n            assert isinstance(b, Tree)\n        self.label = label\n        self.branches = list(branches)\n    def is_leaf(self):\n        return not self.branches\n    def __repr__(self):\n        if self.branches:\n            branch_str = ', ' + repr(self.branches)\n        else:\n            branch_str = ''\n        return 'Tree({0}{1})'.format(repr(self.label), branch_str)\n    def __str__(self):\n        return '\\n'.join(self.indented())\n    def indented(self):\n        lines = []\n        for b in self.branches:\n            for line in b.indented():\n                lines.append('  ' + line)\n        return [str(self.label)] + lines\n", "starter": "def complete(t, d, k):\n    if not t.branches:\n        return ___\n    bs = [___ for b in t.branches]\n    return ___ and all(bs)\n", "solution": "def complete(t, d, k):\n    if not t.branches:\n        return d == 0\n    bs = [complete(b, d - 1, k) for b in t.branches]\n    return len(t.branches) == k and all(bs)\n", "tests": [{"s": "", "e": "complete(Tree(1), 0, 5)", "x": "True"}, {"s": "u = Tree(1, [Tree(1), Tree(1), Tree(1)])", "e": "[complete(u, 1, 3), complete(u, 1, 2), complete(u, 2, 3)]", "x": "[True, False, False]"}, {"s": "", "e": "complete(Tree(1, [u, u, u]), 2, 3)", "x": "True"}], "note": ""}, {"id": "fa15-3b", "exam": "fa15", "n": "3b", "topic": "Lists & Mutation", "title": "Return of the Digits: adder", "kind": "code", "points": 4, "prompt": "Implement `adder`, which takes two lists `x` and `y` of digits representing positive numbers. It **mutates `x`** to represent the sum of `x` and `y` and returns `x`. Hint: `reversed` returns the elements of a sequence in reverse order. Assume `x[0]` and `y[0]` are both positive.", "setup": "", "starter": "def adder(x, y):\n    \"\"\"Adds y into x for lists of digits x and y representing positive numbers.\"\"\"\n    ___\n    return x\n", "solution": "def adder(x, y):\n    carry, i = 0, len(x) - 1\n    for d in reversed(y):\n        if i < 0:\n            x.insert(0, 0)\n            i = 0\n        d = carry + x[i] + d\n        x[i], carry = d % 10, d // 10\n        i -= 1\n    while carry:\n        if i < 0:\n            x.insert(0, 0)\n            i = 0\n        d = x[i] + carry\n        x[i], carry = d % 10, d // 10\n        i -= 1\n    return x\n", "tests": [{"s": "a = [3, 4, 5]", "e": "adder(a, [5, 5])", "x": "[4, 0, 0]"}, {"s": "", "e": "adder(a, [8, 3, 4])", "x": "[1, 2, 3, 4]"}, {"s": "", "e": "adder(a, [3, 3, 3, 3, 3])", "x": "[3, 4, 5, 6, 7]"}, {"s": "", "e": "adder([9, 9], [1])", "x": "[1, 0, 0]"}], "note": ""}, {"id": "fa15-3c", "exam": "fa15", "n": "3c", "topic": "Linked Lists", "title": "Return of the Digits: multiples", "kind": "code", "points": 6, "prompt": "Implement `multiples`, which takes a positive integer `k` and a linked list `s` of digits (1 to 9). It returns a linked list of all positive `n` that are multiples of `k` **greater than `k`** and made up of digits chosen from `s`, in the **same order** as they appear in `s` (each digit used at most once). This site compares exact output, so follow the skeleton: skip a digit first, then use it.", "setup": "class Link:\n    empty = ()\n    def __init__(self, first, rest=empty):\n        assert rest is Link.empty or isinstance(rest, Link)\n        self.first = first\n        self.rest = rest\n    def __repr__(self):\n        if self.rest is not Link.empty:\n            rest_repr = ', ' + repr(self.rest)\n        else:\n            rest_repr = ''\n        return 'Link(' + repr(self.first) + rest_repr + ')'\n    def __str__(self):\n        string = '<'\n        while self.rest is not Link.empty:\n            string += str(self.first) + ' '\n            self = self.rest\n        return string + str(self.first) + '>'\n", "starter": "def multiples(k, s):\n    t = Link.empty\n    def f(n, s):\n        ___\n        if s is Link.empty:\n            if ___:\n                t = ___\n        else:\n            ___\n            ___\n    f(0, s)\n    return t\n", "solution": "def multiples(k, s):\n    t = Link.empty\n    def f(n, s):\n        nonlocal t\n        if s is Link.empty:\n            if n > k and n % k == 0:\n                t = Link(n, t)\n        else:\n            f(n, s.rest)\n            f(n * 10 + s.first, s.rest)\n    f(0, s)\n    return t\n", "tests": [{"s": "odds = Link(1, Link(3, Link(5, Link(7, Link(9)))))", "e": "multiples(5, odds)", "x": "Link(135, Link(15, Link(35)))"}, {"s": "", "e": "multiples(7, odds)", "x": "Link(1379, Link(357, Link(35)))"}, {"s": "", "e": "multiples(9, odds)", "x": "Link(1359, Link(135))"}, {"s": "", "e": "multiples(2, odds)", "x": "()"}], "note": ""}, {"id": "fa15-3d", "exam": "fa15", "n": "3d", "topic": "Orders of Growth", "title": "Return of the Digits: length of multiples(1, s)", "kind": "mc", "points": 2, "prompt": "What describes the length of the linked list returned by `multiples(1, s)` for an input list of length `n`? (Every non-empty selection of digits other than the single digit `1` counts.)", "choices": ["Θ(1)", "Θ(log n)", "Θ(n)", "Θ(n²)", "Θ(2ⁿ)"], "answer": [4], "multi": false, "explain": "Each digit can be chosen or skipped, so there are about 2ⁿ numbers.", "code": ""}, {"id": "fa16-1", "exam": "fa16", "n": "1", "topic": "Object-Oriented Programming", "title": "Halloween", "kind": "wwpd", "points": 8, "prompt": "Write the output displayed by the interpreter for each expression (`Error` if it errors; include any output printed before it). Expressions run in order and have a cumulative effect. The `Link` class is provided.", "code": "class Party:\n    guests = Link.empty\n    def __init__(self, time):\n        Party.guests = Link(time+1, Party.guests)\n    def attend(self):\n        self.guests.rest = Link(self.guests.rest)\n        return self.guests\n\nclass Costume(Party):\n    def __init__(self, bow, tie):\n        Party.guests.rest = Link(bow)\n        self.ie = Link(self)\n    def attend(self):\n        print(repr(self.ie))\n        Party.attend = lambda self: Party(9).guests\n    def __repr__(self):\n        print('Nice')\n        return 'Costume'\n", "setup": "class Link:\n    empty = ()\n    def __init__(self, first, rest=empty):\n        assert rest is Link.empty or isinstance(rest, Link)\n        self.first = first\n        self.rest = rest\n    def __repr__(self):\n        if self.rest is not Link.empty:\n            rest_repr = ', ' + repr(self.rest)\n        else:\n            rest_repr = ''\n        return 'Link(' + repr(self.first) + rest_repr + ')'\n    def __str__(self):\n        string = '<'\n        while self.rest is not Link.empty:\n            string += str(self.first) + ' '\n            self = self.rest\n        return string + str(self.first) + '>'\n", "rows": [{"label": "Party(1).guests", "given": false, "answer": "Link(2)"}, {"label": "Party(3).attend()", "given": false, "answer": "Link(4, Link(Link(2)))"}, {"label": "Costume(5, 6).attend()", "given": false, "answer": "Nice\nLink(Costume)"}, {"label": "Party(7).attend()", "given": false, "answer": "Link(10, Link(8, Link(4, Link(5))))"}]}, {"id": "fa16-3", "exam": "fa16", "n": "3", "topic": "Higher-Order Functions", "title": "Return Policy: quota", "kind": "code", "points": 6, "prompt": "Implement `quota`, a **decorator** that limits the number of times a value can be returned. `quota(f, limit)` returns a function with the same behavior as `f`, except that each value is only returned up to `limit` times. After that, the function returns the string `'Over quota! Limit is now '` followed by the new limit, **and the limit goes down by one** (for all values) each time that happens.", "setup": "", "starter": "def quota(f, limit):\n    values = []\n    def limited(n):\n        ___\n        y = ___\n        count = len(___)\n        values.append(y)\n        if ___:\n            return ___\n        limit = ___\n        return 'Over quota! Limit is now ' + ___\n    return limited\n", "solution": "def quota(f, limit):\n    values = []\n    def limited(n):\n        nonlocal limit\n        y = f(n)\n        count = len([v for v in values if v == y])\n        values.append(y)\n        if count < limit:\n            return y\n        limit = limit - 1\n        return 'Over quota! Limit is now ' + str(limit)\n    return limited\n", "tests": [{"s": "square = lambda x: x * x\nsquare = quota(square, 3)", "e": "square(6)", "x": "36"}, {"s": "", "e": "[square(5) for x in range(3)]", "x": "[25, 25, 25]"}, {"s": "", "e": "square(5)", "x": "'Over quota! Limit is now 2'"}, {"s": "", "e": "square(-6)", "x": "36"}, {"s": "", "e": "square(-6)", "x": "'Over quota! Limit is now 1'"}, {"s": "", "e": "square(7)", "x": "49"}, {"s": "", "e": "square(5)", "x": "'Over quota! Limit is now 0'"}], "note": ""}, {"id": "fa16-4", "exam": "fa16", "n": "4", "topic": "Object-Oriented Programming", "title": "A Classy Election", "kind": "code", "points": 6, "prompt": "Implement `VotingMachine` and `Ballot`. A voting machine creates `k` ballots, determines which choice has the most votes (the **winner**), and detects when a ballot is used more than once. In case of a tie, the winner among the choices with the most votes is the one that **most recently** received a vote. `Ballot.vote` takes a string and a machine must handle any number of choices.", "setup": "", "starter": "class VotingMachine:\n    def __init__(self, k):\n        self.ballots = [___ for i in range(k)]\n        self.votes = {}\n\n    def record(self, ballot, choice):\n        if ballot.used:\n            return 'Fraud: multiple votes from the same ballot!'\n        ___\n        self.votes[choice] = ___ + 1\n        if ___:\n            return choice + ' is losing'\n        else:\n            ___\n            return choice + ' is winning'\n\nclass Ballot:\n    ___\n    def __init__(self, machine):\n        self.machine = machine\n\n    def vote(self, x):\n        return ___\n", "solution": "class VotingMachine:\n    def __init__(self, k):\n        self.ballots = [Ballot(self) for i in range(k)]\n        self.votes = {}\n\n    def record(self, ballot, choice):\n        if ballot.used:\n            return 'Fraud: multiple votes from the same ballot!'\n        ballot.used = True\n        self.votes[choice] = self.votes.get(choice, 0) + 1\n        if self.votes[choice] < max(self.votes.values()):\n            return choice + ' is losing'\n        else:\n            self.winner = choice\n            return choice + ' is winning'\n\nclass Ballot:\n    used = False\n    def __init__(self, machine):\n        self.machine = machine\n\n    def vote(self, x):\n        return self.machine.record(self, x)\n", "tests": [{"s": "machine = VotingMachine(4)\na, b, c, d = machine.ballots", "e": "d.vote('Bruin')", "x": "'Bruin is winning'"}, {"s": "", "e": "b.vote('Bruin')", "x": "'Bruin is winning'"}, {"s": "", "e": "c.vote('Bear')", "x": "'Bear is losing'"}, {"s": "", "e": "a.vote('Bear')", "x": "'Bear is winning'"}, {"s": "", "e": "c.vote('Tree')", "x": "'Fraud: multiple votes from the same ballot!'"}, {"s": "", "e": "machine.winner", "x": "'Bear'"}], "note": ""}, {"id": "fa16-5", "exam": "fa16", "n": "5", "topic": "Linked Lists", "title": "Trick or Tree: path", "kind": "code", "points": 6, "prompt": "Implement `path`, which takes a linked list `s` and a `Tree` `t` and returns whether `s` is a path from the root of `t` to some **leaf**. You may not call `len` on a linked list or use `__len__`/element selection on it.", "setup": "class Tree:\n    def __init__(self, label, branches=[]):\n        for b in branches:\n            assert isinstance(b, Tree)\n        self.label = label\n        self.branches = list(branches)\n    def is_leaf(self):\n        return not self.branches\n    def __repr__(self):\n        if self.branches:\n            branch_str = ', ' + repr(self.branches)\n        else:\n            branch_str = ''\n        return 'Tree({0}{1})'.format(repr(self.label), branch_str)\n    def __str__(self):\n        return '\\n'.join(self.indented())\n    def indented(self):\n        lines = []\n        for b in self.branches:\n            for line in b.indented():\n                lines.append('  ' + line)\n        return [str(self.label)] + lines\nclass Link:\n    empty = ()\n    def __init__(self, first, rest=empty):\n        assert rest is Link.empty or isinstance(rest, Link)\n        self.first = first\n        self.rest = rest\n    def __repr__(self):\n        if self.rest is not Link.empty:\n            rest_repr = ', ' + repr(self.rest)\n        else:\n            rest_repr = ''\n        return 'Link(' + repr(self.first) + rest_repr + ')'\n    def __str__(self):\n        string = '<'\n        while self.rest is not Link.empty:\n            string += str(self.first) + ' '\n            self = self.rest\n        return string + str(self.first) + '>'\n", "starter": "def path(s, t):\n    if ___:\n        return False\n    if ___:\n        return True\n    return ___([___ for b in t.branches])\n", "solution": "def path(s, t):\n    if s is Link.empty or s.first != t.label:\n        return False\n    if s.rest is Link.empty and t.is_leaf():\n        return True\n    return any([path(s.rest, b) for b in t.branches])\n", "tests": [{"s": "t = Tree(1, [Tree(2), Tree(3, [Tree(4), Tree(5)]), Tree(6)])\na = Link(1, Link(3, Link(4)))", "e": "path(a, t)", "x": "True"}, {"s": "", "e": "path(Link(1, Link(3)), t)", "x": "False"}, {"s": "", "e": "path(Link(1, Link(2, Link(7))), t)", "x": "False"}, {"s": "", "e": "path(Link(3, Link(4)), t)", "x": "False"}, {"s": "", "e": "path(Link(1, Link(6)), t)", "x": "True"}], "note": ""}, {"id": "fa16-6a", "exam": "fa16", "n": "6a", "topic": "Trees", "title": "Left it Right There: binary", "kind": "code", "points": 4, "prompt": "Implement `binary`, which takes a list `s` of unique integers and returns a **binary search tree** containing all of them, as a `BTree` or `BTree.empty`. The values in any **path** of this tree must appear in the same order as they did in `s` (so the root is the first element of `s`).", "setup": "class BTree:\n    empty = None\n    def __init__(self, label, left=None, right=None):\n        self.label = label\n        self.left = BTree.empty if left is None else left\n        self.right = BTree.empty if right is None else right\n    def __repr__(self):\n        if self.left is BTree.empty and self.right is BTree.empty:\n            return 'BTree({0})'.format(self.label)\n        elif self.right is BTree.empty:\n            return 'BTree({0}, {1})'.format(self.label, repr(self.left))\n        left = 'BTree.empty' if self.left is BTree.empty else repr(self.left)\n        return 'BTree({0}, {1}, {2})'.format(self.label, left, repr(self.right))\nBTree.empty = BTree('empty')\n", "starter": "def binary(s):\n    assert len(s) == len(set(s)), 'All elements of s should be unique'\n    if ___:\n        return ___\n    root = ___\n    left = ___\n    right = ___\n    return BTree(root, binary(left), binary(right))\n", "solution": "def binary(s):\n    assert len(s) == len(set(s)), 'All elements of s should be unique'\n    if not s:\n        return BTree.empty\n    root = s[0]\n    left = [x for x in s if x < root]\n    right = [x for x in s if x > root]\n    return BTree(root, binary(left), binary(right))\n", "tests": [{"s": "", "e": "binary([3, 5, 1])", "x": "BTree(3, BTree(1), BTree(5))"}, {"s": "", "e": "binary([4, 3, 7, 6, 2, 9, 8])", "x": "BTree(4, BTree(3, BTree(2)), BTree(7, BTree(6), BTree(9, BTree(8))))"}, {"s": "", "e": "binary([]) is BTree.empty", "x": "True"}], "note": ""}, {"id": "fa16-6b", "exam": "fa16", "n": "6b", "topic": "Orders of Growth", "title": "Left it Right There: smallest height", "kind": "mc", "points": 1, "prompt": "What describes the **smallest possible height** of the tree returned by `binary(s)` for a list of `n` integers?", "choices": ["Θ(1)", "Θ(log n)", "Θ(n)", "Θ(n²)", "Θ(2ⁿ)", "None of these"], "answer": [1], "multi": false, "explain": "If every root splits the remaining values evenly, the tree is balanced with height about log₂ n.", "code": ""}, {"id": "fa16-6c", "exam": "fa16", "n": "6c", "topic": "Orders of Growth", "title": "Left it Right There: largest height", "kind": "mc", "points": 1, "prompt": "What describes the **largest possible height** of the tree returned by `binary(s)` for a list of `n` integers?", "choices": ["Θ(1)", "Θ(log n)", "Θ(n)", "Θ(n²)", "Θ(2ⁿ)", "None of these"], "answer": [2], "multi": false, "explain": "If `s` is already sorted, every root has an empty left (or right) side, so the tree is a chain of height n.", "code": ""}, {"id": "fa16-7a", "exam": "fa16", "n": "7a", "topic": "Recursion", "title": "Summer Camp: sums", "kind": "code", "points": 6, "prompt": "Implement `sums`, which takes two positive integers `n` and `k` and returns a list of lists containing all the ways that a list of `k` positive integers can sum to `n`. (This site compares exact output, so keep the order shown by the examples: build each result by adding the **last** element.)", "setup": "", "starter": "def sums(n, k):\n    if ___:\n        return ___\n    y = []\n    for i in range(1, n):\n        y.extend([___ for s in sums(___)])\n    return y\n", "solution": "def sums(n, k):\n    if k == 1:\n        return [[n]]\n    y = []\n    for i in range(1, n):\n        y.extend([s + [i] for s in sums(n - i, k - 1)])\n    return y\n", "tests": [{"s": "", "e": "sums(2, 2)", "x": "[[1, 1]]"}, {"s": "", "e": "sums(2, 3)", "x": "[]"}, {"s": "", "e": "sums(4, 2)", "x": "[[3, 1], [2, 2], [1, 3]]"}, {"s": "", "e": "sums(5, 3)", "x": "[[3, 1, 1], [2, 2, 1], [1, 3, 1], [2, 1, 2], [1, 2, 2], [1, 1, 3]]"}], "note": ""}, {"id": "fa17-2", "exam": "fa17", "n": "2", "topic": "Environment Diagrams", "title": "Buy Local", "kind": "wwpd", "points": 8, "prompt": "Trace this program like an environment diagram. `x` in `g` is `nonlocal`, so it changes `x` in the frame of `f`.", "code": "def f(L, x):\n    L[1] = L\n    def g(c, h, b):\n        nonlocal x\n        x = c\n        if c == 0:\n            b.append(5)\n            b = L + b\n            return h\n        else:\n            return g(c-1, lambda: [c, x], b)\n    p = g(1, None, [4])\n    x += 3\n    return p()\n\nr = f([0, 0], 1)\n", "setup": "", "rows": [{"label": "r", "given": false, "answer": "[1, 3]"}, {"label": "len(r)", "given": false, "answer": "2"}, {"label": "What is the value of `x` in the frame of `f` after `x += 3` runs?", "given": false, "answer": "3"}, {"label": "How many times is `g` called in total?", "given": false, "answer": "2"}, {"label": "What does the call `g(0, ...)` return?", "given": false, "answer": "the lambda function (Function)"}]}, {"id": "fa17-3a", "exam": "fa17", "n": "3a", "topic": "Lists & Mutation", "title": "Pumpkin Splice Latte: splice", "kind": "code", "points": 2, "prompt": "Implement `splice`, which takes lists `a` and `b` and a non-negative integer `k` no larger than `len(a)`. It returns a new list with the first `k` elements of `a`, then all elements of `b`, then the remaining elements of `a`.", "setup": "", "starter": "def splice(a, b, k):\n    return ___\n", "solution": "def splice(a, b, k):\n    return a[:k] + b + a[k:]\n", "tests": [{"s": "", "e": "splice([2, 3, 4, 5], [6, 7], 2)", "x": "[2, 3, 6, 7, 4, 5]"}, {"s": "", "e": "splice([1], [2], 0)", "x": "[2, 1]"}, {"s": "", "e": "splice([1], [2], 1)", "x": "[1, 2]"}], "note": ""}, {"id": "fa17-3b", "exam": "fa17", "n": "3b", "topic": "Sequences & Comprehensions", "title": "Pumpkin Splice Latte: all_splice", "kind": "code", "points": 3, "prompt": "Implement `all_splice`, which returns a list of all non-negative integers `k` such that splicing list `b` into list `a` at `k` creates a list with the same contents as `c`. Assume `splice` is correct.", "setup": "def splice(a, b, k):\n    return a[:k] + b + a[k:]\n", "starter": "def all_splice(a, b, c):\n    return ___\n", "solution": "def all_splice(a, b, c):\n    return [k for k in range(len(a) + 1) if splice(a, b, k) == c]\n", "tests": [{"s": "", "e": "all_splice([1, 2], [3, 4], [1, 3, 4, 2])", "x": "[1]"}, {"s": "", "e": "all_splice([1, 2, 1, 2], [1, 2], [1, 2, 1, 2, 1, 2])", "x": "[0, 2, 4]"}, {"s": "", "e": "all_splice([1], [2], [5])", "x": "[]"}], "note": ""}, {"id": "fa17-3c", "exam": "fa17", "n": "3c", "topic": "Linked Lists", "title": "Pumpkin Splice Latte: splink", "kind": "code", "points": 5, "prompt": "Implement `splink`, which takes `Link`s `a` and `b` and a non-negative integer `k` no larger than the length of `a`. It returns a `Link` with the first `k` elements of `a`, then all elements of `b`, then the remaining elements of `a`. **You may not use `len`, `in`, `for`, `list`, slicing, element selection, addition, or list comprehensions.**", "setup": "class Link:\n    empty = ()\n    def __init__(self, first, rest=empty):\n        assert rest is Link.empty or isinstance(rest, Link)\n        self.first = first\n        self.rest = rest\n    def __repr__(self):\n        if self.rest is not Link.empty:\n            rest_repr = ', ' + repr(self.rest)\n        else:\n            rest_repr = ''\n        return 'Link(' + repr(self.first) + rest_repr + ')'\n    def __str__(self):\n        string = '<'\n        while self.rest is not Link.empty:\n            string += str(self.first) + ' '\n            self = self.rest\n        return string + str(self.first) + '>'\n", "starter": "def splink(a, b, k):\n    if ___:\n        return a\n    elif ___:\n        return ___\n    return ___\n", "solution": "def splink(a, b, k):\n    if b is Link.empty:\n        return a\n    elif k == 0:\n        return Link(b.first, splink(a, b.rest, k))\n    return Link(a.first, splink(a.rest, b, k - 1))\n", "tests": [{"s": "", "e": "splink(Link(2, Link(3, Link(4, Link(5)))), Link(6, Link(7)), 2)", "x": "Link(2, Link(3, Link(6, Link(7, Link(4, Link(5))))))"}, {"s": "", "e": "splink(Link(1), Link(2), 0)", "x": "Link(2, Link(1))"}, {"s": "", "e": "splink(Link(1), Link(2), 1)", "x": "Link(1, Link(2))"}], "note": ""}, {"id": "fa17-4a", "exam": "fa17", "n": "4a", "topic": "Linked Lists", "title": "Both Ways: both", "kind": "code", "points": 4, "prompt": "Implement `both`, which takes two **sorted** linked lists of `Link` objects and returns whether some value is in both of them. **You may not use `len`, `in`, `for`, `list`, slicing, element selection, addition, or list comprehensions.**", "setup": "class Link:\n    empty = ()\n    def __init__(self, first, rest=empty):\n        assert rest is Link.empty or isinstance(rest, Link)\n        self.first = first\n        self.rest = rest\n    def __repr__(self):\n        if self.rest is not Link.empty:\n            rest_repr = ', ' + repr(self.rest)\n        else:\n            rest_repr = ''\n        return 'Link(' + repr(self.first) + rest_repr + ')'\n    def __str__(self):\n        string = '<'\n        while self.rest is not Link.empty:\n            string += str(self.first) + ' '\n            self = self.rest\n        return string + str(self.first) + '>'\n", "starter": "def both(a, b):\n    if ___:\n        return False\n    if ___:\n        a, b = b, a\n    return ___\n", "solution": "def both(a, b):\n    if a is Link.empty or b is Link.empty:\n        return False\n    if a.first > b.first:\n        a, b = b, a\n    return a.first == b.first or both(a.rest, b)\n", "tests": [{"s": "", "e": "both(Link(1, Link(3, Link(5, Link(7)))), Link(2, Link(4, Link(6))))", "x": "False"}, {"s": "", "e": "both(Link(1, Link(3, Link(5, Link(7)))), Link(2, Link(7, Link(9))))", "x": "True"}, {"s": "", "e": "both(Link(1, Link(4, Link(5, Link(7)))), Link(2, Link(4, Link(5))))", "x": "True"}, {"s": "", "e": "both(Link.empty, Link(1))", "x": "False"}], "note": ""}, {"id": "fa17-4b", "exam": "fa17", "n": "4b", "topic": "Orders of Growth", "title": "Both Ways: minimum comparisons", "kind": "mc", "points": 2, "prompt": "Which Θ expression describes the **minimum** number of comparisons (`<`, `>`, `<=`, `==`, `>=`) required to verify that two sorted lists of length `n` contain no values in common?", "choices": ["Θ(1)", "Θ(log n)", "Θ(n)", "Θ(n²)", "Θ(2ⁿ)", "None of these"], "answer": [2], "multi": false, "explain": "Even in the best case you must compare enough elements to rule out every possible shared value; merging two sorted lists takes about 2n comparisons, and fewer than Θ(n) cannot rule out all common values.", "code": ""}, {"id": "fa17-4c", "exam": "fa17", "n": "4c", "topic": "Recursion", "title": "Both Ways: ways", "kind": "code", "points": 5, "prompt": "Implement `ways`, which takes two values `start` and `end`, a non-negative integer `k`, and a list of one-argument functions `actions`. It returns the number of sequences of actions `f1, f2, …, fj` such that `f1(f2(…(fj(start))))`-style application (apply in order) reaches `end` with `j <= k`. The same action may be chosen many times. If a sequence of actions reaches `end`, **no further actions** can be applied.", "setup": "", "starter": "def ways(start, end, k, actions):\n    if ___:\n        return 1\n    elif ___:\n        return 0\n    return ___([___ for f in actions])\n", "solution": "def ways(start, end, k, actions):\n    if start == end:\n        return 1\n    elif k == 0:\n        return 0\n    return sum([ways(f(start), end, k - 1, actions) for f in actions])\n", "tests": [{"s": "", "e": "ways(-1, 1, 5, [abs, lambda x: x+2])", "x": "2"}, {"s": "", "e": "ways(1, 10, 5, [lambda x: x+1, lambda x: x+4])", "x": "3"}, {"s": "", "e": "ways(1, 20, 5, [lambda x: x+1, lambda x: x+4])", "x": "0"}, {"s": "", "e": "ways([3], [2, 3, 2, 3], 4, [lambda x: [2]+x, lambda x: 2*x, lambda x: x[:-1]])", "x": "3"}], "note": ""}, {"id": "fa17-5a", "exam": "fa17", "n": "5a", "topic": "Data Abstraction", "title": "Autumn Leaves: pile", "kind": "code", "points": 5, "prompt": "A **pile** for a tree `t` with no repeated leaf labels is a dictionary in which the label of each leaf is a key and its value is the **path from that leaf to the root**: either `()` for the root, or a two-element tuple holding the label of the node's parent and the rest of the path (the path from the parent). Implement `pile` for a tree built with the tree data abstraction.", "setup": "def tree(label, branches=[]):\n    for branch in branches:\n        assert is_tree(branch), 'branches must be trees'\n    return [label] + list(branches)\ndef label(tree):\n    return tree[0]\ndef branches(tree):\n    return tree[1:]\ndef is_tree(tree):\n    if type(tree) != list or len(tree) < 1:\n        return False\n    for branch in branches(tree):\n        if not is_tree(branch):\n            return False\n    return True\ndef is_leaf(tree):\n    return not branches(tree)\n", "starter": "def pile(t):\n    p = {}\n    def gather(___, ___):\n        if is_leaf(u):\n            ___\n        for b in branches(u):\n            ___\n    ___\n    return p\n", "solution": "def pile(t):\n    p = {}\n    def gather(u, path):\n        if is_leaf(u):\n            p[label(u)] = path\n        for b in branches(u):\n            gather(b, (label(u), path))\n    gather(t, ())\n    return p\n", "tests": [{"s": "", "e": "pile(tree(5, [tree(3, [tree(1), tree(2)]), tree(6, [tree(7)])]))", "x": "{1: (3, (5, ())), 2: (3, (5, ())), 7: (6, (5, ()))}"}, {"s": "", "e": "pile(tree(1))", "x": "{1: ()}"}], "note": ""}, {"id": "fa17-5b", "exam": "fa17", "n": "5b", "topic": "Object-Oriented Programming", "title": "Autumn Leaves: Path", "kind": "code", "points": 4, "prompt": "Implement `Path`, a class whose constructor takes a tree `t` and a `leaf_label`. When a `Path` is printed, the labels from the root to the leaf of `t` with that label are displayed separated by dashes. Assume `pile` is correct.", "setup": "def tree(label, branches=[]):\n    for branch in branches:\n        assert is_tree(branch), 'branches must be trees'\n    return [label] + list(branches)\ndef label(tree):\n    return tree[0]\ndef branches(tree):\n    return tree[1:]\ndef is_tree(tree):\n    if type(tree) != list or len(tree) < 1:\n        return False\n    for branch in branches(tree):\n        if not is_tree(branch):\n            return False\n    return True\ndef is_leaf(tree):\n    return not branches(tree)\ndef pile(t):\n    p = {}\n    def gather(u, path):\n        if is_leaf(u):\n            p[label(u)] = path\n        for b in branches(u):\n            gather(b, (label(u), path))\n    gather(t, ())\n    return p\n", "starter": "class Path:\n    def __init__(self, t, leaf_label):\n        self.pile, self.end = pile(t), leaf_label\n\n    def __str__(self):\n        path, s = ___, ___\n        while path:\n            path, s = ___, ___\n        return s\n", "solution": "class Path:\n    def __init__(self, t, leaf_label):\n        self.pile, self.end = pile(t), leaf_label\n\n    def __str__(self):\n        path, s = self.pile[self.end], str(self.end)\n        while path:\n            path, s = path[1], str(path[0]) + '-' + s\n        return s\n", "tests": [{"s": "a = tree(5, [tree(3, [tree(1), tree(2)]), tree(6, [tree(7)])])", "e": "print(Path(a, 7), Path(a, 2))", "x": "5-6-7 5-3-2\n"}, {"s": "", "e": "print(Path(a, 1))", "x": "5-3-1\n"}], "note": ""}, {"id": "fa18-2", "exam": "fa18", "n": "2", "topic": "Sequences & Comprehensions", "title": "lowest", "kind": "code", "points": 3, "prompt": "Implement `lowest`, which takes a list of numbers `s` and returns a list of only the elements of `s` with the **smallest absolute value**. You may only write a single name in each blank.", "setup": "", "starter": "def lowest(s):\n    return (lambda y: [x for ___ in ___ if abs(___)==y])(abs(___(___, key=___)))\n", "solution": "def lowest(s):\n    return (lambda y: [x for x in s if abs(x)==y])(abs(min(s, key=abs)))\n", "tests": [{"s": "", "e": "lowest([3, -2, 2, -3, -4, 2, 3, 4])", "x": "[-2, 2, 2]"}, {"s": "", "e": "lowest(range(-5, 5))", "x": "[0]"}, {"s": "", "e": "lowest([7])", "x": "[7]"}], "note": ""}, {"id": "fa18-3", "exam": "fa18", "n": "3", "topic": "Environment Diagrams", "title": "Hocus Pocus", "kind": "wwpd", "points": 8, "prompt": "Trace this program like an environment diagram. (`put` has a local name `pocus` that is later redefined by a `def`.) Then answer questions about the final state.", "code": "def put(hocus, pocus):\n    hocus = 2\n    you = pocus[hocus]\n    def pocus():\n        nonlocal hocus\n        if type(spell.pop()) == list:\n            you.append(hocus)\n            return [pocus(), hocus]\n        else:\n            hocus = 3\n            return spell[0:1]\n    return pocus\n\nspell = [6, 5, [4]]\nyou = spell\nresult = put(spell, you)()\n", "setup": "", "rows": [{"label": "result", "given": false, "answer": "[[6], 3]"}, {"label": "spell", "given": false, "answer": "[6]"}, {"label": "you is spell", "given": false, "answer": "True"}, {"label": "What is the final value of `you` inside the frame of `put`?", "given": false, "answer": "[4, 2]"}, {"label": "What is the final value of `hocus` in the frame of `put`?", "given": false, "answer": "3"}]}, {"id": "fa18-4a", "exam": "fa18", "n": "4a", "topic": "Recursion", "title": "Nonplussed: plus", "kind": "code", "points": 3, "prompt": "A **plus expression** for a non-negative integer `n` is made by inserting `+` symbols between the digits of `n` so that there are never more than two consecutive digits in a term. For example, `20+1+8` is a plus expression for 2018 with value 29. A two-digit number starting with 0 evaluates to its ones digit (so `2+01+8` is 11). Implement `plus`, which returns the **largest** value of any plus expression for `n`.", "setup": "", "starter": "def plus(n):\n    if n:\n        return ___\n    return 0\n", "solution": "def plus(n):\n    if n:\n        return max(plus(n // 10) + n % 10, plus(n // 100) + n % 100)\n    return 0\n", "tests": [{"s": "", "e": "plus(5)", "x": "5"}, {"s": "", "e": "plus(18)", "x": "18"}, {"s": "", "e": "plus(2018)", "x": "38"}, {"s": "", "e": "plus(123456)", "x": "102"}, {"s": "", "e": "plus(1604)", "x": "65"}, {"s": "", "e": "plus(160450)", "x": "115"}], "note": ""}, {"id": "fa18-4b", "exam": "fa18", "n": "4b", "topic": "Recursion", "title": "Nonplussed: plusses", "kind": "code", "points": 5, "prompt": "Implement `plusses`, which takes non-negative integers `n` and `cap` and returns the **number of plus expressions** for `n` that have a value **less than** `cap`. For example `plusses(2018, 38)` is 4 (`2+0+1+8`, `20+1+8`, `2+0+18`, `2+01+8`, but not `20+18`).", "setup": "", "starter": "def plusses(n, cap):\n    if ___:\n        return 1\n    elif ___:\n        return 0\n    else:\n        return ___\n", "solution": "def plusses(n, cap):\n    if n == 0 and cap > 0:\n        return 1\n    elif cap <= 0:\n        return 0\n    else:\n        return plusses(n // 10, cap - n % 10) + (plusses(n // 100, cap - n % 100) if n >= 10 else 0)\n", "tests": [{"s": "", "e": "plusses(123, 16)", "x": "2"}, {"s": "", "e": "plusses(2018, 38)", "x": "4"}, {"s": "", "e": "plusses(1, 2)", "x": "1"}, {"s": "", "e": "plusses(5, 5)", "x": "0"}], "note": ""}, {"id": "fa18-4c", "exam": "fa18", "n": "4c", "topic": "Orders of Growth", "title": "Nonplussed: number of additions", "kind": "mc", "points": 2, "prompt": "Which Θ expression describes how many addition operations are required to evaluate a plus expression for a positive integer `n`?", "choices": ["Θ(1)", "Θ(log n)", "Θ(n)", "Θ(n²)", "Θ(2ⁿ)", "Θ(10ⁿ)", "None of these"], "answer": [1], "multi": false, "explain": "A plus expression has at most one fewer `+` than the number of digits of `n`, and the number of digits is about log₁₀ n.", "code": ""}, {"id": "fa18-5a", "exam": "fa18", "n": "5a", "topic": "Object-Oriented Programming", "title": "Midterm Elections: Poll and tally", "kind": "code", "points": 6, "prompt": "Implement the `Poll` class and the `tally` function. `tally(c)` returns a list of `(poll name, vote count)` pairs, one for every `Poll` that received at least one vote for choice `c`. Assume all `Poll` names are distinct. Hint: the dictionary `get(key, default)` method returns the value for a key if it appears, and `default` otherwise.", "setup": "", "starter": "class Poll:\n    s = []\n    def __init__(self, n):\n        self.name = ___\n        self.votes = {}\n        ___\n\n    def vote(self, choice):\n        self.___ = ___\n\ndef tally(c):\n    return ___\n", "solution": "class Poll:\n    s = []\n    def __init__(self, n):\n        self.name = n\n        self.votes = {}\n        Poll.s.append(self)\n\n    def vote(self, choice):\n        self.votes[choice] = self.votes.get(choice, 0) + 1\n\ndef tally(c):\n    return [(p.name, p.votes[c]) for p in Poll.s if c in p.votes]\n", "tests": [{"s": "a, b, c = Poll('A'), Poll('B'), Poll('C')\nc.vote('dog')\na.vote('dog')\na.vote('cat')\nb.vote('cat')\na.vote('dog')", "e": "tally('dog')", "x": "[('A', 2), ('C', 1)]"}, {"s": "", "e": "tally('cat')", "x": "[('A', 1), ('B', 1)]"}, {"s": "", "e": "tally('fish')", "x": "[]"}], "note": ""}, {"id": "fa18-5b", "exam": "fa18", "n": "5b", "topic": "Inheritance", "title": "Midterm Elections: Crooked", "kind": "code", "points": 2, "prompt": "Implement the `vote` method of the `Crooked` class, which **only records every other** `vote` call for each `Crooked` instance. Only odd-numbered calls (first, third, fifth, …) are recorded.", "setup": "class Poll:\n    s = []\n    def __init__(self, n):\n        self.name = n\n        self.votes = {}\n        Poll.s.append(self)\n    def vote(self, choice):\n        self.votes[choice] = self.votes.get(choice, 0) + 1\n", "starter": "class Crooked(Poll):\n    record = True\n    def vote(self, choice):\n        if self.record:\n            ___\n        self.___ = ___\n", "solution": "class Crooked(Poll):\n    record = True\n    def vote(self, choice):\n        if self.record:\n            Poll.vote(self, choice)\n        self.record = not self.record\n", "tests": [{"s": "d = Crooked('D')\nfor s in ['dog', 'cat', 'dog', 'cat', 'cat']:\n    d.vote(s)", "e": "d.votes", "x": "{'dog': 2, 'cat': 1}"}, {"s": "", "e": "Crooked.record", "x": "True"}], "note": ""}, {"id": "fa18-6", "exam": "fa18", "n": "6", "topic": "Linked Lists", "title": "Dr. Frankenlink: replace", "kind": "code", "points": 4, "prompt": "Implement `replace`, which takes two non-empty linked lists `s` and `t` and positive integers `i < j`. It **mutates** `s` by removing the elements with indices `i` through `j - 1` and splicing in **the links of `t`** (so a later change to `t` is reflected in `s`). Assume `s` has at least `j` elements.", "setup": "class Link:\n    empty = ()\n    def __init__(self, first, rest=empty):\n        assert rest is Link.empty or isinstance(rest, Link)\n        self.first = first\n        self.rest = rest\n    def __repr__(self):\n        if self.rest is not Link.empty:\n            rest_repr = ', ' + repr(self.rest)\n        else:\n            rest_repr = ''\n        return 'Link(' + repr(self.first) + rest_repr + ')'\n    def __str__(self):\n        string = '<'\n        while self.rest is not Link.empty:\n            string += str(self.first) + ' '\n            self = self.rest\n        return string + str(self.first) + '>'\n", "starter": "def replace(s, t, i, j):\n    assert s is not Link.empty and t is not Link.empty and i > 0 and i < j\n    if i > 1:\n        return ___\n    after = s\n    for _ in range(j):\n        after = ___\n    end = t\n    while ___:\n        end = end.rest\n    s.rest, end.rest = ___, ___\n", "solution": "def replace(s, t, i, j):\n    assert s is not Link.empty and t is not Link.empty and i > 0 and i < j\n    if i > 1:\n        return replace(s.rest, t, i - 1, j - 1)\n    after = s\n    for _ in range(j):\n        after = after.rest\n    end = t\n    while end.rest is not Link.empty:\n        end = end.rest\n    s.rest, end.rest = t, after\n", "tests": [{"s": "s, t = Link(3, Link(4, Link(5, Link(6, Link(7))))), Link(0, Link(1, Link(2)))\nreplace(s, t, 2, 4)", "e": "print(s)", "x": "<3 4 0 1 2 7>\n"}, {"s": "t.rest.first = 8", "e": "print(s)", "x": "<3 4 0 8 2 7>\n"}, {"s": "u = Link(1, Link(2, Link(3, Link(4))))\nreplace(u, Link(9), 1, 3)", "e": "print(u)", "x": "<1 9 4>\n"}], "note": ""}, {"id": "fa18-7", "exam": "fa18", "n": "7", "topic": "Iterators & Generators", "title": "Trictionary or Treat: lookups", "kind": "code", "points": 5, "prompt": "A **trictionary** is a pair of `Tree`s `k` and `v` with identical structure. The labels in `k` are keys (a key may label many nodes) and the values for a key are the labels of the corresponding nodes in `v`. A **lookup function** for a node in `k` takes `v` and returns the label of the corresponding node in `v`.\n\nImplement the generator `lookups`, which takes a `Tree` `k` and a `key` and yields one lookup function for each node of `k` labeled `key`.", "setup": "class Tree:\n    def __init__(self, label, branches=[]):\n        for b in branches:\n            assert isinstance(b, Tree)\n        self.label = label\n        self.branches = list(branches)\n    def is_leaf(self):\n        return not self.branches\n    def __repr__(self):\n        if self.branches:\n            branch_str = ', ' + repr(self.branches)\n        else:\n            branch_str = ''\n        return 'Tree({0}{1})'.format(repr(self.label), branch_str)\n    def __str__(self):\n        return '\\n'.join(self.indented())\n    def indented(self):\n        lines = []\n        for b in self.branches:\n            for line in b.indented():\n                lines.append('  ' + line)\n        return [str(self.label)] + lines\n", "starter": "def lookups(k, key):\n    if ___:\n        yield lambda v: ___\n    for ___:\n        for lookup in ___:\n            yield new_lookup(i, lookup)\n\ndef new_lookup(i, f):\n    def g(v):\n        return ___\n    return g\n", "solution": "def lookups(k, key):\n    if k.label == key:\n        yield lambda v: v.label\n    for i in range(len(k.branches)):\n        for lookup in lookups(k.branches[i], key):\n            yield new_lookup(i, lookup)\n\ndef new_lookup(i, f):\n    def g(v):\n        return f(v.branches[i])\n    return g\n", "tests": [{"s": "k = Tree(5, [Tree(7, [Tree(2)]), Tree(8, [Tree(3), Tree(4)]), Tree(5, [Tree(4), Tree(2)])])\nv = Tree('Go', [Tree('C', [Tree('C')]), Tree('A', [Tree('S'), Tree(6)]), Tree('L', [Tree(1), Tree('A')])])", "e": "[f(v) for f in lookups(k, 2)]", "x": "['C', 'A']"}, {"s": "", "e": "[f(v) for f in lookups(k, 3)]", "x": "['S']"}, {"s": "", "e": "[f(v) for f in lookups(k, 6)]", "x": "[]"}, {"s": "", "e": "[f(v) for f in lookups(k, 5)]", "x": "['Go', 'L']"}], "note": ""}, {"id": "fa19-1", "exam": "fa19", "n": "1", "topic": "Object-Oriented Programming", "title": "What Would Python Display", "kind": "wwpd", "points": 12, "prompt": "Write the output the interpreter displays (`Error` if it errors, `Forever` if it never finishes, `Function` for a function value). Expressions run in order and have a cumulative effect. Assume the code below ran without errors.", "code": "class C:\n    x = 'e'\n    def f(self, y):\n        self.x = self.x + y\n        return self\n    def __str__(self):\n        return 'go'\n\nclass Big(C):\n    x = 'u'\n    def f(self, y):\n        C.x = C.x + y\n        return C.f(self, 'm')\n    def __repr__(self):\n        return '<bears>'\n\nm = C().f('i')\nn = Big().f('o')\n\ndef g(y):\n    def h(x):\n        nonlocal h\n        k = 2\n        if len(x) == 1:\n            h = lambda x: y\n            k = 1\n        return [-x[0]] + h(x[k:])\n    return h(y)\n\npy = {3: {5: [7]}}\nthon = {5: 6, 7: py}\nthon[7][3] = thon\nq = range(3, 5)\nr = iter(q)\ncode = [next(r), next(iter(q)), list(r)]\n", "setup": "", "rows": [{"label": "[m.x, n.x]", "given": false, "answer": "['ei', 'um']"}, {"label": "[C.f(n, 'a').x, C().x]", "given": false, "answer": "['uma', 'eo']"}, {"label": "print(m, n)", "given": false, "answer": "go go"}, {"label": "n", "given": false, "answer": "<bears>"}, {"label": "g([3, 4, 5])", "given": false, "answer": "[-3, -5, 3, 4, 5]"}, {"label": "py[3][5]", "given": false, "answer": "6"}, {"label": "code", "given": false, "answer": "[3, 3, [4]]"}]}, {"id": "fa19-2", "exam": "fa19", "n": "2", "topic": "Environment Diagrams", "title": "Environmental Studies", "kind": "wwpd", "points": 8, "prompt": "Trace this program the way an environment diagram would, then answer questions about the final state.", "code": "def power(cut):\n    def wind(y):\n        nonlocal cut\n        cut, g = cut - 1, cut\n        y = [e]\n        return y is e\n    if cut and not wind('y'):\n        return power(cut)\n    else:\n        return [g, 'e']\ng = 'p'\ne = [g]\ng = 2\ne.append(power(1))\n", "setup": "", "rows": [{"label": "e", "given": false, "answer": "['p', [2, 'e']]"}, {"label": "len(e)", "given": false, "answer": "2"}, {"label": "What does the call `power(1)` return?", "given": false, "answer": "[2, 'e']"}, {"label": "What is the final value of `cut` in the frame of `power(1)` (f1)?", "given": false, "answer": "0"}, {"label": "What is the value of `g` inside the frame of `wind`?", "given": false, "answer": "1"}, {"label": "How many local frames does the diagram need?", "given": false, "answer": "3"}]}, {"id": "fa19-3a", "exam": "fa19", "n": "3a", "topic": "Trees", "title": "Max Tree", "kind": "code", "points": 4, "prompt": "Implement `max_tree`, which takes a `Tree` `t` and a function `key` (one argument, returns a number). It returns the label `n` of `t` for which `key(n)` is **largest**. On ties, any is fine. You may not call `min` or `max`.", "setup": "class Tree:\n    def __init__(self, label, branches=[]):\n        for b in branches:\n            assert isinstance(b, Tree)\n        self.label = label\n        self.branches = list(branches)\n    def is_leaf(self):\n        return not self.branches\n    def __repr__(self):\n        if self.branches:\n            branch_str = ', ' + repr(self.branches)\n        else:\n            branch_str = ''\n        return 'Tree({0}{1})'.format(repr(self.label), branch_str)\n    def __str__(self):\n        return '\\n'.join(self.indented())\n    def indented(self):\n        lines = []\n        for b in self.branches:\n            for line in b.indented():\n                lines.append('  ' + line)\n        return [str(self.label)] + lines\n", "starter": "def max_tree(t, key):\n    if t.is_leaf():\n        return ___\n    x = ___\n    for b in t.branches:\n        m = ___\n        if ___:\n            x = m\n    return x\n", "solution": "def max_tree(t, key):\n    if t.is_leaf():\n        return t.label\n    x = t.label\n    for b in t.branches:\n        m = max_tree(b, key)\n        if key(m) > key(x):\n            x = m\n    return x\n", "tests": [{"s": "t = Tree(6, [Tree(3, [Tree(5)]), Tree(2), Tree(4, [Tree(7)])])", "e": "max_tree(t, key=lambda x: x)", "x": "7"}, {"s": "", "e": "max_tree(t, key=lambda x: -x)", "x": "2"}, {"s": "", "e": "max_tree(t, key=lambda x: -abs(x - 4))", "x": "4"}, {"s": "", "e": "max_tree(Tree(1), key=lambda x: x)", "x": "1"}], "note": ""}, {"id": "fa19-3b", "exam": "fa19", "n": "3b", "topic": "Trees", "title": "Max Tree in one line", "kind": "code", "points": 2, "prompt": "Now implement `max_tree` in **one line** using a single call to the built-in `max`. You may not add any additional calls to `max`.", "setup": "class Tree:\n    def __init__(self, label, branches=[]):\n        for b in branches:\n            assert isinstance(b, Tree)\n        self.label = label\n        self.branches = list(branches)\n    def is_leaf(self):\n        return not self.branches\n    def __repr__(self):\n        if self.branches:\n            branch_str = ', ' + repr(sel
