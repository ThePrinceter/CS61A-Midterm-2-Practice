rst = first\n        self.rest = rest\n    def __repr__(self):\n        if self.rest is not Link.empty:\n            rest_repr = ', ' + repr(self.rest)\n        else:\n            rest_repr = ''\n        return 'Link(' + repr(self.first) + rest_repr + ')'\n    def __str__(self):\n        string = '<'\n        while self.rest is not Link.empty:\n            string += str(self.first) + ' '\n            self = self.rest\n        return string + str(self.first) + '>'\n", "starter": "def tens(s):\n    def f(suffix, total):\n        if total % 10 == 0:\n            print(total)\n        if ___:\n            ___\n    ___\n", "solution": "def tens(s):\n    def f(suffix, total):\n        if total % 10 == 0:\n            print(total)\n        if suffix.rest is not Link.empty:\n            f(suffix.rest, total + suffix.rest.first)\n    f(s, s.first)\n", "tests": [{"s": "", "e": "tens(Link(3, Link(9, Link(8, Link(10, Link(0, Link(14, Link(6))))))))", "x": "20\n30\n30\n50\n"}, {"s": "", "e": "tens(Link(10))", "x": "10\n"}, {"s": "", "e": "tens(Link(1, Link(2)))", "x": ""}, {"s": "", "e": "tens(Link(5, Link(5, Link(10))))", "x": "10\n20\n"}], "note": ""}, {"id": "sp23-4a", "exam": "sp23", "n": "4a", "topic": "Trees", "title": "Tree Trimming: exclude", "kind": "code", "points": 7, "prompt": "Implement `exclude(t, x)`. It returns a **new** `Tree` containing the root of `t` and each non-root node whose label is not `x`. The parent of a kept node is its nearest kept ancestor. `t` must not be modified.", "setup": "class Tree:\n    def __init__(self, label, branches=[]):\n        for b in branches:\n            assert isinstance(b, Tree)\n        self.label = label\n        self.branches = list(branches)\n    def is_leaf(self):\n        return not self.branches\n    def __repr__(self):\n        if self.branches:\n            branch_str = ', ' + repr(self.branches)\n        else:\n            branch_str = ''\n        return 'Tree({0}{1})'.format(repr(self.label), branch_str)\n    def __str__(self):\n        return '\\n'.join(self.indented())\n    def indented(self):\n        lines = []\n        for b in self.branches:\n            for line in b.indented():\n                lines.append('  ' + line)\n        return [str(self.label)] + lines\n", "starter": "def exclude(t, x):\n    filtered_branches = map(lambda y: ___, t.branches)\n    bs = []\n    for b in filtered_branches:\n        if ___:\n            bs.___(___)\n        else:\n            bs.append(b)\n    return Tree(t.label, bs)\n", "solution": "def exclude(t, x):\n    filtered_branches = map(lambda y: exclude(y, x), t.branches)\n    bs = []\n    for b in filtered_branches:\n        if b.label == x:\n            bs.extend(b.branches)\n        else:\n            bs.append(b)\n    return Tree(t.label, bs)\n", "tests": [{"s": "t = Tree(1, [Tree(2, [Tree(2), Tree(3)]), Tree(4, [Tree(1)])])", "e": "exclude(t, 2)", "x": "Tree(1, [Tree(3), Tree(4, [Tree(1)])])"}, {"s": "", "e": "t", "x": "Tree(1, [Tree(2, [Tree(2), Tree(3)]), Tree(4, [Tree(1)])])"}, {"s": "", "e": "exclude(t, 1)", "x": "Tree(1, [Tree(2, [Tree(2), Tree(3)]), Tree(4)])"}], "note": ""}, {"id": "sp23-4b", "exam": "sp23", "n": "4b", "topic": "Trees", "title": "Tree Trimming: remove", "kind": "code", "points": 3, "prompt": "Implement `remove(t, x)`, which **mutates** `t` by removing all non-root nodes labeled `x`, then returns `t`. Assume `exclude` is implemented correctly.", "setup": "class Tree:\n    def __init__(self, label, branches=[]):\n        for b in branches:\n            assert isinstance(b, Tree)\n        self.label = label\n        self.branches = list(branches)\n    def is_leaf(self):\n        return not self.branches\n    def __repr__(self):\n        if self.branches:\n            branch_str = ', ' + repr(self.branches)\n        else:\n            branch_str = ''\n        return 'Tree({0}{1})'.format(repr(self.label), branch_str)\n    def __str__(self):\n        return '\\n'.join(self.indented())\n    def indented(self):\n        lines = []\n        for b in self.branches:\n            for line in b.indented():\n                lines.append('  ' + line)\n        return [str(self.label)] + lines\n\ndef exclude(t, x):\n    filtered_branches = map(lambda y: exclude(y, x), t.branches)\n    bs = []\n    for b in filtered_branches:\n        if b.label == x:\n            bs.extend(b.branches)\n        else:\n            bs.append(b)\n    return Tree(t.label, bs)\n", "starter": "def remove(t, x):\n    ___\n    return t\n", "solution": "def remove(t, x):\n    t.branches = exclude(t, x).branches\n    return t\n", "tests": [{"s": "t = Tree(1, [Tree(2, [Tree(2), Tree(3)]), Tree(4)])", "e": "remove(t, 2)", "x": "Tree(1, [Tree(3), Tree(4)])"}, {"s": "", "e": "remove(t, 3)", "x": "Tree(1, [Tree(4)])"}, {"s": "", "e": "t", "x": "Tree(1, [Tree(4)])"}], "note": ""}, {"id": "sp23-5a", "exam": "sp23", "n": "5a", "topic": "Recursion", "title": "Parking: count_park", "kind": "code", "points": 4, "prompt": "A motorcycle takes 1 spot (`%`), a car takes 2 adjacent spots (`<>`), and `.` is an empty spot. Implement `count_park(n)`, the number of ways to park vehicles in `n` adjacent spots (some or all spots may be empty).", "setup": "", "starter": "def count_park(n):\n    if n < 0:\n        return 0\n    if n == 0:\n        return ___\n    return ___\n", "solution": "def count_park(n):\n    if n < 0:\n        return 0\n    if n == 0:\n        return 1\n    return count_park(n - 1) * 2 + count_park(n - 2)\n", "tests": [{"s": "", "e": "count_park(1)", "x": "2"}, {"s": "", "e": "count_park(2)", "x": "5"}, {"s": "", "e": "count_park(4)", "x": "29"}, {"s": "", "e": "count_park(3)", "x": "12"}, {"s": "", "e": "count_park(6)", "x": "169"}], "note": ""}, {"id": "sp23-5b", "exam": "sp23", "n": "5b", "topic": "Iterators & Generators", "title": "Parking: park", "kind": "code", "points": 6, "prompt": "Implement `park`, a generator that takes a non-negative integer `n` and yields (in any order) every string representing `n` adjacent parking spots. You may not use `yield from`.", "setup": "", "starter": "def park(n):\n    if n == 0:\n        yield ''\n    elif n > 0:\n        for s in park(n - 1):\n            ___\n            ___\n        for s in ___:\n            ___\n", "solution": "def park(n):\n    if n == 0:\n        yield ''\n    elif n > 0:\n        for s in park(n - 1):\n            yield '%' + s\n            yield '.' + s\n        for s in park(n - 2):\n            yield '<>' + s\n", "tests": [{"s": "", "e": "sorted(park(1))", "x": "['%', '.']"}, {"s": "", "e": "sorted(park(2))", "x": "['%%', '%.', '.%', '..', '<>']"}, {"s": "", "e": "sorted(park(3))", "x": "['%%%', '%%.', '%.%', '%..', '%<>', '.%%', '.%.', '..%', '...', '.<>', '<>%', '<>.']"}, {"s": "", "e": "len(list(park(4)))", "x": "29"}, {"s": "", "e": "sorted(park(0))", "x": "['']"}], "note": ""}, {"id": "sp23-5c", "exam": "sp23", "n": "5c", "topic": "Iterators & Generators", "title": "Parking: pack (A+ question)", "kind": "code", "points": null, "prompt": "**A+ question, worth no points.** Implement `pack`, a generator that yields all strings of `n` spots in which an equal number of cars and motorcycles are parked, no motorcycle is adjacent to a car, and no empty spot is adjacent to another empty spot.\n\nFill in the one blank in `g`.", "setup": "", "starter": "def pack(n):\n    def f(n, k):\n        if n == 0 and k == 0:\n            yield ''\n        elif n > 0:\n            yield from g(n - 1, k - 1, '<', '%')\n            yield from g(n - 1, k, '.', '.')\n            yield from g(n - 2, k + 1, '%', '<>')\n\n    def g(n, k, no, yes):\n        yield from ___\n\n    yield from f(n, 0)\n", "solution": "def pack(n):\n    def f(n, k):\n        if n == 0 and k == 0:\n            yield ''\n        elif n > 0:\n            yield from g(n - 1, k - 1, '<', '%')\n            yield from g(n - 1, k, '.', '.')\n            yield from g(n - 2, k + 1, '%', '<>')\n\n    def g(n, k, no, yes):\n        yield from (yes + s for s in f(n, k) if not s.startswith(no))\n\n    yield from f(n, 0)\n", "tests": [{"s": "", "e": "sorted(pack(4))", "x": "['%.<>', '<>.%']"}, {"s": "", "e": "sorted(pack(7))", "x": "['%%.<><>', '<><>.%%']"}, {"s": "", "e": "sorted(pack(8))", "x": "['%%.<>.<>', '%%.<><>.', '%.%.<><>', '%.<><>.%', '.%%.<><>', '.<><>.%%', '<>.%%.<>', '<>.<>.%%', '<><>.%%.', '<><>.%.%']"}], "note": ""}, {"id": "sp24-1", "exam": "sp24", "n": "1", "topic": "Linked Lists", "title": "What Would Python Display?", "kind": "wwpd", "points": 7, "prompt": "Write the output printed for each expression, or `Error` if an error occurs.", "code": "def shake(it):\n    if it is not Link.empty and it.rest is not Link.empty:\n        if it.first + 1 < it.rest.first:\n            it.rest = Link(it.rest.first-1, it.rest)\n            shake(it)\n        else:\n            shake(it.rest)\n\nit = Link(2, Link(5, Link(7)))\noff = Link(1, it.rest)\nshake(it)\n\ndef cruel(summer):\n    while summer is not Link.empty:\n        yield summer.first\n        summer = summer.rest\n        if summer is not Link.empty:\n            summer = summer.rest\n\nsummer = Link(1, Link(2, Link(3, Link(4))))\n", "setup": "class Link:\n    empty = ()\n    def __init__(self, first, rest=empty):\n        assert rest is Link.empty or isinstance(rest, Link)\n        self.first = first\n        self.rest = rest\n    def __repr__(self):\n        if self.rest is not Link.empty:\n            rest_repr = ', ' + repr(self.rest)\n        else:\n            rest_repr = ''\n        return 'Link(' + repr(self.first) + rest_repr + ')'\n    def __str__(self):\n        string = '<'\n        while self.rest is not Link.empty:\n            string += str(self.first) + ' '\n            self = self.rest\n        return string + str(self.first) + '>'\n", "rows": [{"label": "print(it)", "given": false, "answer": "<2 3 4 5 6 7>"}, {"label": "print(off)", "given": false, "answer": "<1 5 6 7>"}, {"label": "print([x*x for x in cruel(summer)])", "given": false, "answer  that location, and `repeat(s)` returns the transform applied to `s`. Every `Mic` starts connected to a `Front` speaker that repeats the exact same signal.", "setup": "", "starter": "class Mic:\n    def __init__(self):\n        self.speakers = ___\n\n    def sing(self, lyrics):\n        for k in self.speakers.keys():  # iterate over the keys of a dictionary\n            print(k, '-', ___.repeat(lyrics))\n\nclass Speaker:\n    def __init__(self, transform):\n        self.transform = transform\n\n    def connect(self, m, location):\n        ___\n\n    def repeat(self, s):\n        return ___\n", "solution": "class Mic:\n    def __init__(self):\n        self.speakers = {'Front': Speaker(lambda s: s)}\n\n    def sing(self, lyrics):\n        for k in self.speakers.keys():\n            print(k, '-', self.speakers[k].repeat(lyrics))\n\nclass Speaker:\n    def __init__(self, transform):\n        self.transform = transform\n\n    def connect(self, m, location):\n        m.speakers[location] = self\n\n    def repeat(self, s):\n        return self.transform(s)\n", "tests": [{"s": "m = Mic()", "e": "m.sing('Is this thing on?')", "x": "Front - Is this thing on?\n"}, {"s": "Speaker(str.lower).connect(m, 'Left Side')\nSpeaker(str.upper).connect(m, 'Right Side')", "e": "", "x": ""}, {"s": "", "e": "m.sing('You belong with me.')", "x": "Front - You belong with me.\nLeft Side - you belong with me.\nRight Side - YOU BELONG WITH ME.\n"}], "note": ""}, {"id": "sp24-4a", "exam": "sp24", "n": "4a", "topic": "Sequences & Comprehensions", "title": "Who's counting?: is_strip", "kind": "code", "points": 4, "prompt": "A **strip** is a list of integers in which each integer is one more than the last, such as `[3, 4, 5, 6]`. Empty and one-element lists are strips. Implement `is_strip`.", "setup": "", "starter": "def is_strip(s):\n    assert type(s) == list\n    return ___ or s == list(range(___, ___))\n", "solution": "def is_strip(s):\n    assert type(s) == list\n    return len(s) == 0 or s == l str__(self):\n        return '\\n'.join(self.indented())\n    def indented(self):\n        lines = []\n        for b in self.branches:\n            for line in b.indented():\n                lines.append('  ' + line)\n        return [str(self.label)] + lines\n\ndef has_strip(t):\n    if t.is_leaf():\n        return True\n    for b in t.branches:\n        if b.label == t.label + 1 and has_strip(b):\n            return True\n    return False\ndef test_only_strips(t):\n    only_strips(t)\n    return t\n", "starter": "def only_strips(t):\n    t.branches = [b for b in t.branches if ___]\n", "solution": "def only_strips(t):\n    t.branches = [b for b in t.branches if b.label == t.label + 1 and has_strip(b) and not only_strips(b)]\n", "tests": [{"s": "", "e": "test_only_strips(Tree(1, [Tree(2), Tree(2, [Tree(2), Tree(3, [Tree(4)]), Tree(3)])]))", "x": "Tree(1, [Tree(2), Tree(2, [Tree(3, [Tree(4)]), Tree(3)])])"}, {"s": "", "e": "test_only_strips(Tree(5, [Tree(6), Tree(6, [Tree(7, [Tree(9)])]), Tree(7)]))", "x": "Tree(5, [Tree(6)])"}], "note": ""}, {"id": "sp25-1", "exam": "sp25", "n": "1", "topic": "Iterators & Generators", "title": "What Would Python Display?", "kind": "wwpd", "points": 6, "prompt": "Write the value of each expression, or `Error` if an error occurs. Each expression is evaluated in order, so earlier ones can affect later ones. Write `Map` for a map object and `Function` for a function. The `pop` method of a list removes and returns its last element.", "code": "s = [2, [5, 8], 11]\nt = [1, 3, 5, 7, 9]\n\ndef add_t(x):\n    if isinstance(x, list):\n        return [add_t(y) for y in x]\n    else:\n        return x + t.pop()\n\nm = map(add_t, s)\n", "setup": "", "rows": [{"label": "[x[1] for x in s if isinstance(x, list)]", "given": false, "answer": "[8]"}, {"label": "next(m)", "given": false, "answer": "11"}, {"label": "t.pop()", "given": false, "answer": "7"}, {"label": "[next(m) for z in range(2)]", "given": false, "answer": "[[10, 11], 12]"}]}, {"id": "sp25-2", "exam": "sp25", "n": "2", "topic": "Environment Diagrams", "title": "This or That", "kind": "wwpd", "points": 7, "prompt": "Draw an environment diagram for this program (the diagram is not scored). Then answer the questions.", "code": "def f(this):\n    that = this[1]\n    def g(copy):\n        that[0] = 4\n        copy[0] = 5\n        copy[1].append(6)\n        print(copy)\n    g(list(this))\n    this.append(that)\n    that.append(7)\n\nt = [1, [2], 3]\nf(t)\n", "setup": "", "rows": [{"label": "What is displayed by the call to `print` inside `g` (line 7)?", "given": false, "answer": "[5, [4, 6], 3]"}, {"label": "What is displayed by `print(t)` at the end (line 14)?", "given": false, "answer": "[1, [4, 6, 7], 3, [4, 6, 7]]"}]}, {"id": "sp25-3a", "exam": "sp25", "n": "3a", "topic": "Iterators & Generators", "title": "Event: split", "kind": "code", "points": 5, "prompt": "An `Event` has a `start` time and an `end` time (minutes after midnight). Its `split(k)` generator yields `k` equal-length consecutive `Event`s that together cover the original. Assume `k` evenly divides the duration.", "setup": "", "starter": "class Event:\n    def __init__(self, start, end):\n        self.start, self.end = start, end\n\n    def __repr__(self):\n        return f'Event({self.start}, {self.end})'\n\n    def split(self, k):\n        assert (self.end - self.start) % k == 0  # k evenly divides the duration of the event.\n        length = (self.end - self.start) // k\n        start = ___\n        for i in range(k):\n            yield ___\n            ___\n", "solution": "class Event:\n    \"\"\"An event that starts at one time and ends at another.\n    >>> calapalooza = Event(980, 1180)  # 16:20 to 19:40\n    >>> list(calapalooza.split(4))\n    [Event(980, 1030), Event(1030, 1080), Event(1080, 1130), Event(1130, 1180)]\n    \"\"\"\n    def __init__(self, start, end):\n        self.start, self.end = start, end\n    def __repr__(self):\n        return f'Event({self.start}, {self.end})'\n    def split(self, k):\n        assert (self.end - self.start) % k == 0  # k evenly divides the duration of the event.\n        length = (self.end - self.start) // k\n        start = self.start\n        for i in range(k):\n            yield Event(start, start + length)\n            start = start + length\n", "tests": [{"s": "calapalooza = Event(980, 1180)", "e": "list(calapalooza.split(4))", "x": "[Event(980, 1030), Event(1030, 1080), Event(1080, 1130), Event(1130, 1180)]"}, {"s": "", "e": "list(Event(0, 10).split(1))", "x": "[Event(0, 10)]"}, {"s": "", "e": "list(Event(5, 11).split(3))", "x": "[Event(5, 7), Event(7, 9), Event(9, 11)]"}], "note": ""}, {"id": "sp25-3b", "exam": "sp25", "n": "3b", "topic": "Inheritance", "title": "Event: BerkeleyEvent", "kind": "code", "points": 5, "prompt": "A `BerkeleyEvent` is an `Event` with a modified `split`. The first event yielded starts when the original starts, but all events **after the first** are 10 minutes shorter and start 10 minutes after the previous event ends.", "setup": "class Event:\n    \"\"\"An event that starts at one time and ends at another.\n    >>> calapalooza = Event(980, 1180)  # 16:20 to 19:40\n    >>> list(calapalooza.split(4))\n    [Event(980, 1030), Event(1030, 1080), Event(1080, 1130), Event(1130, 1180)]\n    \"\"\"\n    def __init__(self, start, end):\n        self.start, self.end = start, end\n    def __repr__(self):\n        return f'Event({self.start}, {self.end})'\n    def split(self, k):\n        assert (self.end - self.start) % k == 0  # k evenly divides the duration of the event.\n        length = (self.end - self.start) // k\n        start = self.start\n        for i in range(k):\n            yield Event(start, start + length)\n            start = start + length\n", "starter": "class BerkeleyEvent(Event):\n    time = 10  # How much time between events\n\n    def split(self, k):\n        first = True\n        for e in ___:\n            if first:\n                first = False\n            else:\n                ___.start = ___ + ___\n            yield e\n", "solution": "class BerkeleyEvent(Event):\n    time = 10\n\n    def split(self, k):\n        first = True\n        for e in super().split(k):\n            if first:\n                first = False\n            else:\n                e.start = e.start + self.time\n            yield e\n", "tests": [{"s": "", "e": "list(BerkeleyEvent(840, 930).split(3))", "x": "[Event(840, 870), Event(880, 900), Event(910, 930)]"}, {"s": "", "e": "list(BerkeleyEvent(0, 40).split(2))", "x": "[Event(0, 20), Event(30, 40)]"}, {"s": "", "e": "list(BerkeleyEvent(0, 30).split(1))", "x": "[Event(0, 30)]"}], "note": ""}, {"id": "sp25-4a", "exam": "sp25", "n": "4a", "topic": "Trees", "title": "DeepSeek: deepest", "kind": "code", "points": 5, "prompt": "The **depth** of the root is 0 and each other node has depth one more than its parent. Implement `deepest`, which takes a `Tree` `t` and a value `x` and returns the **largest** depth of a node labeled `x`, or `None` if `x` is not a label in `t`.", "setup": "class Tree:\n    def __init__(self, label, branches=[]):\n        for b in branches:\n            assert isinstance(b, Tree)\n        self.label = label\n        self.branches = list(branches)\n    def is_leaf(self):\n        return not self.branches\n    def __repr__(self):\n        if self.branches:\n            branch_str = ', ' + repr(self.branches)\n        else:\n            branch_str = ''\n        return 'Tree({0}{1})'.format(repr(self.label), branch_str)\n    def __str__(self):\n        return '\\n'.join(self.indented())\n    def indented(self):\n        lines = []\n        for b in self.branches:\n            for line in b.indented():\n                lines.append('  ' + line)\n        return [str(self.label)] + lines\n", "starter": "def deepest(t, x):\n    below = [deepest(b, x) for b in t.branches]\n    depths = [ ___ ]\n    if ___:\n        depths.___\n    if depths:\n        return max(depths)\n    else:\n        return None\n", "solution": "def deepest(t, x):\n    below = [deepest(b, x) for b in t.branches]\n    depths = [1 + d for d in below if d is not None]\n    if t.label == x:\n        depths.append(0)\n    if depths:\n        return max(depths)\n    else:\n        return None\n", "tests": [{"s": "example = Tree(30, [Tree(20), Tree(20, [Tree(30, [Tree(20)])])])", "e": "deepest(example, 30)", "x": "2"}, {"s": "", "e": "deepest(example, 20)", "x": "3"}, {"s": "", "e": "print(deepest(example, 10))", "x": "None\n"}], "note": ""}, {"id": "sp25-4b", "exam": "sp25", "n": "4b", "topic": "Dictionaries", "title": "DeepSeek: deep", "kind": "code", "points": 6, "prompt": "Implement `deep`, which takes a `Tree` and returns a dictionary with each unique label as a key. The value for each key `k` is the largest depth of any node labeled `k`. **You may not call `deepest`.** Hint: `d.get(1, 2)` returns the value for key `1` if present, and `2` otherwise.", "setup": "class Tree:\n    def __init__(self, label, branches=[]):\n        for b in branches:\n            assert isinstance(b, Tree)\n        self.label = label\n        self.branches = list(branches)\n    def is_leaf(self):\n        return not self.branches\n    def __repr__(self):\n        if self.branches:\n            branch_str = ', ' + repr(self.branches)\n        else:\n            branch_str = ''\n        return 'Tree({0}{1})'.format(repr(self.label), branch_str)\n    def __str__(self):\n        return '\\n'.join(self.indented())\n    def indented(self):\n        lines = []\n        for b in self.branches:\n            for line in b.indented():\n                lines.append('  ' + line)\n        return [str(self.label)] + lines\n", "starter": "def deep(t):\n    result = {}\n    def visit(node, depth):\n        ___ = max(___, result.get(___, 0))\n        for b in node.branches:\n            ___\n    visit(t, 0)\n    return result\n", "solution": "def deep(t):\n    result = {}\n    def visit(node, depth):\n        result[node.label] = max(depth, result.get(node.label, 0))\n        for b in node.branches:\n            visit(b, depth + 1)\n    visit(t, 0)\n    return result\n", "tests": [{"s": "", "e": "deep(Tree(30, [Tree(20), Tree(20, [Tree(30, [Tree(20)])])]))", "x": "{30: 2, 20: 3}"}, {"s": "", "e": "deep(Tree(1))", "x": "{1: 0}"}, {"s": "", "e": "deep(Tree(1, [Tree(1, [Tree(1)])]))", "x": "{1: 2}"}], "note": ""}, {"id": "sp25-5a", "exam": "sp25", "n": "5a", "topic": "Linked Lists", "title": "Just Add and Multiply: muladd", "kind": "code", "points": 5, "prompt": "A **plus-times-expression** inserts `+` or `*` between each adjacent pair of numbers. Implement `muladd`, which takes a linked list of numbers `s` and returns the value of the plus-times-expression that starts with `*` and then alternates between `+` and `*`. If `s` has one element, return it.", "setup": "class Link:\n    empty = ()\n    def __init__(self, first, rest=empty):\n        assert rest is Link.empty or isinstance(rest, Link)\n        self.first = first\n        self.rest = rest\n    def __repr__(self):\n        if self.rest is not Link.empty:\n            rest_repr = ', ' + repr(self.rest)\n        else:\n            rest_repr = ''\n        return 'Link(' + repr(self.first) + rest_repr + ')'\n    def __str__(self):\n        string = '<'\n        while self.rest is not Link.empty:\n            string += str(self.first) + ' '\n            self = self.rest\n        return string + str(self.first) + '>'\n", "starter": "def muladd(s):\n    if s is Link.empty:\n        return 0\n    elif s.rest is Link.empty:\n        return ___\n    else:\n        return ___\n", "solution": "def muladd(s):\n    if s is Link.empty:\n        return 0\n    elif s.rest is Link.empty:\n        return s.first\n    else:\n        return s.first * s.rest.first + muladd(s.rest.rest)\n", "tests": [{"s": "example = Link(9, Link(4, Link(7, Link(2, Link(0)))))", "e": "muladd(example)", "x": "50"}, {"s": "", "e": "muladd(Link(2, example))", "x": "46"}, {"s": "", "e": "muladd(Link(2))", "x": "2"}, {"s": "", "e": "muladd(Link(3, Link(4)))", "x": "12"}], "note": ""}, {"id": "sp25-5b", "exam": "sp25", "n": "5b", "topic": "Recursion", "title": "Just Add and Multiply: ways", "kind": "code", "points": 5, "prompt": "Implement `ways(k, n)`, which returns the number of plus-times-expressions for a list of `n` numbers that have **at most `k` consecutive `*` symbols**. For example `2*3*4+5` has 2 in a row.", "setup": "", "starter": "def ways(k, n):\n    def f(left, n):\n        if ___:\n            return 1\n        result = f(___, n - 1)\n        if left:\n            result += ___\n        return result\n    return f(k, n)\n", "solution": "def ways(k, n):\n    def f(left, n):\n        if n == 1:\n            return 1\n        result = f(k, n - 1)\n        if left:\n            result += f(left - 1, n - 1)\n        return result\n    return f(k, n)\n", "tests": [{"s": "", "e": "ways(1, 4)", "x": "5"}, {"s": "", "e": "ways(2, 4)", "x": "7"}, {"s": "", "e": "ways(2, 5)", "x": "13"}, {"s": "", "e": "ways(5, 1)", "x": "1"}, {"s": "", "e": "ways(1, 2)", "x": "2"}], "note": ""}, {"id": "sp25-5c", "exam": "sp25", "n": "5c", "topic": "Recursion", "title": "Just Add and Multiply: close", "kind": "code", "points": 6, "prompt": "Implement `close`, which takes a list of numbers `s` and a number `x`. It returns the value of some plus-times-expression for `s` that is **closest** (in absolute value) to `x`. Hint: a slice that starts past the end of a list is empty: `[2, 3, 4][3:]` is `[]`. `product` is provided.", "setup": "def product(s):\n    \"\"\"Return the result of multiplying together the elements of a non-empty list of numbers s.\"\"\"\n    if len(s) == 1:\n        return s[0]\n    return s[0] * product(s[1:])\n", "starter": "def close(s, x):\n    if not s:\n        return 0\n    choices = [product(s[:i]) + ___ for i in range(1, len(s) + 1)]\n    return min(choices, key=___)\n", "solution": "def close(s, x):\n    if not s:\n        return 0\n    choices = [product(s[:i]) + close(s[i:], x - product(s[:i])) for i in range(1, len(s) + 1)]\n    return min(choices, key=lambda y: abs(x - y))\n", "tests": [{"s": "", "e": "close([1, 2, 3, 4], 10)", "x": "10"}, {"s": "", "e": "close([1, 2, 3, 4], 20)", "x": "24"}, {"s": "", "e": "close([1, 2, 3, 4], 30)", "x": "25"}, {"s": "", "e": "close([3, 7, 5, 4, 2, 6], 66)", "x": "67"}], "note": ""}, {"id": "sp25-5d", "exam": "sp25", "n": "5d", "topic": "Recursion", "title": "Just Add and Multiply: close_exp (A+ question)", "kind": "code", "points": null, "prompt": "**A+ question, worth no points.** Fill in the blank of `close_exp`, which returns a **string** containing a plus-times-expression for `s` whose value is as close as possible to `x`. `eval('2+2')` evaluates to `4`. Assume `close` is correct.", "setup": "def product(s):\n    \"\"\"Return the result of multiplying together the elements of a non-empty list of numbers s.\"\"\"\n    if len(s) == 1:\n        return s[0]\n    return s[0] * product(s[1:])\ndef close(s, x):\n    if not s:\n        return 0\n    choices = [product(s[:i]) + close(s[i:], x - product(s[:i])) for i in range(1, len(s) + 1)]\n    return min(choices, key=lambda y: abs(x - y))\n", "starter": "def close_exp(s, x):\n    goal = close(s, x)\n    term = ''\n    for i in range(len(s)):\n        if term:\n            term += '*'\n        term += str(s[i])\n        candidate = term\n        if i < len(s) - 1:\n            candidate += ___\n        if eval(candidate) == goal:\n            return candidate\n", "solution": "def close_exp(s, x):\n    goal = close(s, x)\n    term = ''\n    for i in range(len(s)):\n        if term:\n            term += '*'\n        term += str(s[i])\n        candidate = term\n        if i < len(s) - 1:\n            candidate += '+' + close_exp(s[i + 1:], x - eval(term))\n        if eval(candidate) == goal:\n            return candidate\n", "tests": [{"s": "", "e": "print(close_exp([1, 2, 3, 4], 10))", "x": "1+2+3+4\n"}, {"s": "", "e": "print(close_exp([1, 2, 3, 4], 20))", "x": "1*2*3*4\n"}, {"s": "", "e": "print(close_exp([1, 2, 3, 4], 30))", "x": "1+2*3*4\n"}, {"s": "", "e": "print(close_exp([3, 7, 5, 4, 2, 6], 66))", "x": "3*7+5*4*2+6\n"}], "note": ""}, {"id": "sp26-1", "exam": "sp26", "n": "1", "topic": "Object-Oriented Programming", "title": "Finding Errors", "kind": "code", "points": 2, "prompt": "Sofia wrote a class for a rectangular prism. Running `RectangularPrism(10, 10, 4).volume()` should give `400`, but it raises `TypeError: unsupported operand type(s) for *: 'method' and 'int'`. The error is in the `volume` method. **Fix the buggy line** so it returns the correct value.", "setup": "", "starter": "class RectangularPrism:\n    def __init__(self, width, length, height):\n        self.width = width\n        self.length = length\n        self.height = height\n\n    def base_area(self):\n        return self.width * self.length\n\n    def is_square_base(self):\n        return self.width == self.length\n\n    def volume(self):\n        return self.base_area * self.height\n", "solution": "class RectangularPrism:\n    def __init__(self, width, length, height):\n        self.width = width\n        self.length = length\n        self.height = height\n\n    def base_area(self):\n        return self.width * self.length\n\n    def is_square_base(self):\n        return self.width == self.length\n\n    def volume(self):\n        return self.base_area() * self.height\n", "tests": [{"s": "sq = RectangularPrism(10, 10, 4)", "e": "sq.volume()", "x": "400"}, {"s": "", "e": "RectangularPrism(2, 3, 4).volume()", "x": "24"}, {"s": "", "e": "sq.is_square_base()", "x": "True"}], "note": ""}, {"id": "sp26-2a", "exam": "sp26", "n": "2a", "topic": "Iterators & Generators", "title": "Hog Revisited (a)", "kind": "wwpd", "points": 2, "prompt": "Assume `roll_dice` is implemented correctly (it rolls **all** `num_rolls` dice) and this code runs without errors. What does `result` evaluate to?", "code": "def fixed_dice():\n    while True:\n        yield 3\n        yield 4\n        yield 1\n        yield 5\n\ndie = fixed_dice()\nresult1 = roll_dice(3, die)\nresult2 = roll_dice(3, die)\nresult = result1 + result2\n", "setup": "def roll_dice(num_rolls, dice):\n    total, has_one = 0, False\n    for _ in range(num_rolls):\n        roll = next(dice)\n        total += roll\n        if roll == 1:\n            has_one = True\n    return 1 if has_one else total\n", "rows": [{"label": "result", "given": false, "answer": "13"}]}, {"id": "sp26-2b", "exam": "sp26", "n": "2b", "topic": "Higher-Order Functions", "title": "Hog Revisited (b)", "kind": "wwpd", "points": 1, "prompt": "A Hog strategy is a function that takes the current player's score and the opponent's score and returns the number of dice to roll.", "code": "def make_catch_up_strategy(base_rolls):\n    \"\"\"Returns a strategy that rolls more dice if the player is losing.\"\"\"\n    def strategy(score, opponent_score):\n        if score < opponent_score:\n            return base_rolls + 2\n        return base_rolls\n    return strategy\n\nmy_strat = make_catch_up_strategy(4)\ndice_to_roll = my_strat(25, 30)\n", "setup": "", "rows": [{"label": "dice_to_roll", "given": false, "answer": "6"}, {"label": "my_strat(30, 25)", "given": false, "answer": "4"}]}, {"id": "sp26-3", "exam": "sp26", "n": "3", "topic": "Data Abstraction", "title": "Branching Out: last_leaf", "kind": "code", "points": 3, "prompt": "Finish `last_leaf`, which returns the label of the **last leaf** in a tree built with the tree data abstraction: the rightmost leaf, reached by always following the last branch until a leaf is found. Use the ADT functions (`label`, `branches`, `is_leaf`).", "setup": "def tree(label, branches=[]):\n    for branch in branches:\n        assert is_tree(branch), 'branches must be trees'\n    return [label] + list(branches)\ndef label(tree):\n    return tree[0]\ndef branches(tree):\n    return tree[1:]\ndef is_tree(tree):\n    if type(tree) != list or len(tree) < 1:\n        return False\n    for branch in branches(tree):\n        if not is_tree(branch):\n            return False\n    return True\ndef is_leaf(tree):\n    return not branches(tree)\n", "starter": "def last_leaf(t):\n    if is_leaf(t):\n        ___\n    last_branch = ___\n    return last_leaf(last_branch)\n", "solution": "def last_leaf(t):\n    if is_leaf(t):\n        return label(t)\n    last_branch = branches(t)[-1]\n    return last_leaf(last_branch)\n", "tests": [{"s": "t = tree('a', [tree('b', [tree('d'), tree('e')]), tree('c')])", "e": "last_leaf(t)", "x": "'c'"}, {"s": "t2 = tree(5, [tree(2, [tree(7), tree(1, [tree(0), tree(4)]), tree(9)]), tree(3, [tree(6), tree(8)])])", "e": "last_leaf(t2)", "x": "8"}, {"s": "", "e": "last_leaf(tree(1))", "x": "1"}], "note": ""}, {"id": "sp26-4", "exam": "sp26", "n": "4", "topic": "Lists & Mutation", "title": "Teaching Mutating Lists of Hurdles", "kind": "wwpd", "points": 9, "prompt": "Assume the following code has been run (box-and-pointer diagrams help!). For `mystery`, write what Python prints, including any error type.", "code": "lst1 = [1, 2, 3, 4, 5]\nlst2 = lst1[:3]\nlst3 = lst1\nlst1.append(lst2)\nlst3.extend([lst2.pop() for _ in range(2)])\nlst2[0] = 'c'\nlst4 = lst1[:]\n\ndef mystery(lst):\n    for i in range(len(lst)):\n        print(lst[i])\n        if lst[i] < 0:\n            lst.pop(i)\n", "setup": "", "rows": [{"label": "lst1 is lst3", "given": false, "answer": "True"}, {"label": "lst1 is lst4", "given": false, "answer": "False"}, {"label": "lst1 == lst4", "given": false, "answer": "True"}, {"label": "lst1", "given": false, "answer": "[1, 2, 3, 4, 5, ['c'], 3, 2]"}, {"label": "mystery([-1, -3, 4, -2, 7, 3])", "given": false, "answer": "-1\n4\n-2\n3\nError: IndexError"}]}, {"id": "sp26-5", "exam": "sp26", "n": "5", "topic": "Inheritance", "title": "Making Pen Friends!", "kind": "code", "points": 9, "prompt": "A `Pen` has an `animals` dictionary. An `Animal` has a unique `name`, the `pen` it belongs to, and a list of its `friends` (by name). A new `Animal` is added to its pen's `animals` dictionary under its name. An `Animal` may only befriend another animal in the **same** `Pen`; then each is added to the other's `friends` list.\n\nFill in the blanks in `Animal`. The subclasses are provided.", "setup": "", "starter": "class Pen:\n    def __init__(self):\n        self.animals = {}\n\nclass Animal:\n    sound = \"silent\"\n\n    def __init__(self, name, pen):\n        self.name = name\n        self.pen = pen\n        ___\n        self.friends = ___\n\n    def befriend(self, other):\n        if ___:\n            print(\"Cannot befriend an animal that doesn't share a pen!\")\n        else:\n            ___\n            ___\n            print(f\"{self.name} made a new friend!\")\n\n    def describe(self):\n        return f'{self.name} goes {self.sound}'\n\n    def __repr__(self):\n        return f'Animal({self.name})'\n\nclass Chicken(Animal):\n    sound = 'bawk'\n\n    def __repr__(self):\n        return f'Chicken({self.name})'\n\nclass BabyChick(Chicken):\n    def __init__(self, name, pen, mother):\n        super().__init__(name, pen)\n        self.mother = mother\n\n    def describe(self):\n        return super().describe() + f', hatched by {self.mother}'\n", "solution": "class Pen:\n    def __init__(self):\n        self.animals = {}\n\nclass Animal:\n    sound = \"silent\"\n\n    def __init__(self, name, pen):\n        self.name = name\n        self.pen = pen\n        pen.animals[name] = self\n        self.friends = []\n\n    def befriend(self, other):\n        if self.pen is not other.pen:\n            print(\"Cannot befriend an animal that doesn't share a pen!\")\n        else:\n            self.friends.append(other.name)\n            other.friends.append(self.name)\n            print(f\"{self.name} made a new friend!\")\n\n    def describe(self):\n        return f'{self.name} goes {self.sound}'\n\n    def __repr__(self):\n        return f'Animal({self.name})'\n\nclass Chicken(Animal):\n    sound = 'bawk'\n\n    def __repr__(self):\n        return f'Chicken({self.name})'\n\nclass BabyChick(Chicken):\n    def __init__(self, name, pen, mother):\n        super().__init__(name, pen)\n        self.mother = mother\n\n    def describe(self):\n        return super().describe() + f', hatched by {self.mother}'\n", "tests": [{"s": "my_pen = Pen()\nother_pen = Pen()\nalice = Chicken('Alice', my_pen)\nbob = Chicken('Bob', other_pen)\nclarice = Chicken('Clarice', my_pen)", "e": "my_pen.animals", "x": "{'Alice': Chicken(Alice), 'Clarice': Chicken(Clarice)}"}, {"s": "", "e": "other_pen.animals", "x": "{'Bob': Chicken(Bob)}"}, {"s": "", "e": "clarice.friends", "x": "[]"}, {"s": "", "e": "clarice.befriend(bob)", "x": "Cannot befriend an animal that doesn't share a pen!\n"}, {"s": "", "e": "clarice.befriend(alice)", "x": "Clarice made a new friend!\n"}, {"s": "", "e": "alice.friends", "x": "['Clarice']"}, {"s": "", "e": "repr(alice)", "x": "'Chicken(Alice)'"}, {"s": "larry = BabyChick('Larry', my_pen, alice)", "e": "larry.describe()", "x": "'Larry goes bawk, hatched by Chicken(Alice)'"}], "note": ""}, {"id": "sp26-6", "exam": "sp26", "n": "6", "topic": "Iterators & Generators", "title": "When The Last Leaf Falls...", "kind": "wwpd", "points": 6, "prompt": "`iter` uses the `__iter__` method of an object. Draw the tree if it helps. The first four `next(it)` calls after the first print show their values in a real interpreter, but you only need to answer the printed ones.", "code": "class Tree:\n    def __init__(self, label, branches=[]):\n        self.label = label\n        for branch in branches:\n            assert isinstance(branch, Tree)\n        self.branches = branches\n\n    def __iter__(self):\n        yield self.label\n        for branch in self.branches:\n            yield from iter(branch)\n\nt = Tree(5, [Tree(2, [Tree(7), Tree(1, [Tree(0), Tree(4)]), Tree(9)]), Tree(3, [Tree(6), Tree(8)])])\nit = iter(t)\n", "setup": "", "rows": [{"label": "print(next(it))  # FIRST PRINT STATEMENT", "given": false, "answer": "5"}, {"label": "next(it)", "given": true, "answer": ""}, {"label": "next(it)", "given": true, "answer": ""}, {"label": "next(it)", "given": true, "answer": ""}, {"label": "next(it)", "given": true, "answer": ""}, {"label": "print(next(it))  # SECOND PRINT STATEMENT", "given": false, "answer": "4"}, {"label": "How many more times can `next(it)` be called after the second print before `StopIteration` is raised? (integer)", "given": false, "answer": "4"}]}, {"id": "sp26-7a", "exam": "sp26", "n": "7a", "topic": "Recursion", "title": "The Power of Friendship: circle", "kind": "code", "points": 1, "prompt": "Friends sit in a circle taking turns. Implement `circle(f, n)`, which returns the next friend given the current friend `f` and total people in the circle `n`.", "setup": "", "starter": "def circle(f, n):\n    return ___\n", "solution": "def circle(f, n):\n    return (f + 1) % n\n", "tests": [{"s": "", "e": "circle(0, 2)", "x": "1"}, {"s": "", "e": "circle(4, 5)", "x": "0"}, {"s": "", "e": "circle(3, 6)", "x": "4"}], "note": ""}, {"id": "sp26-7b", "exam": "sp26", "n": "7b", "topic": "Recursion", "title": "The Power of Friendship: earring", "kind": "code", "points": 12, "prompt": "You and your friends make friendship earrings of `s` beads. On friend `i`'s turn they put on **at least 1** and **up to `limit[i]`** beads. An earring must have exactly `s` beads. You are friend 0 and go first. Implement `earring`, which returns the total number of ways to make an earring. Assume every `limit[i] ≥ 1` and `len(limit) ≥ 2`.", "setup": "def circle(f, n):\n    return (f + 1) % n\n", "starter": "def earring(s, limit):\n    def helper(friend, length_left):\n        if ___:\n            return 1\n        next_f = ___\n        return ___([___ for m in range(___, min(___) + 1)])\n    return ___\n", "solution": "def earring(s, limit):\n    def helper(friend, length_left):\n        if length_left == 0:\n            return 1\n        next_f = circle(friend, len(limit))\n        return sum([helper(next_f, length_left - m) for m in range(1, min(limit[friend], length_left) + 1)])\n    return helper(0, s)\n", "tests": [{"s": "", "e": "earring(3, [1, 2])", "x": "2"}, {"s": "", "e": "earring(4, [2, 1])", "x": "3"}, {"s": "", "e": "earring(5, [1, 1, 1, 1, 1])", "x": "1"}, {"s": "", "e": "earring(4, [2, 2, 2])", "x": "5"}], "note": ""}, {"id": "sp26-8", "exam": "sp26", "n": "8", "topic": "Linked Lists", "title": "Linking A List", "kind": "code", "points": 5, "prompt": "Write `convert`, which takes a list and returns a linked list with the elements in the same order. If an element is itself a list, it goes into the linked list **as is** (do not convert it). Recall `Link.empty = ()`.", "setup": "class Link:\n    empty = ()\n    def __init__(self, first, rest=empty):\n        assert rest is Link.empty or isinstance(rest, Link)\n        self.first = first\n        self.rest = rest\n    def __repr__(self):\n        if self.rest is not Link.empty:\n            rest_repr = ', ' + repr(self.rest)\n        else:\n            rest_repr = ''\n        return 'Link(' + repr(self.first) + rest_repr + ')'\n    def __str__(self):\n        string = '<'\n        while self.rest is not Link.empty:\n            string += str(self.first) + ' '\n            self = self.rest\n        return string + str(self.first) + '>'\n", "starter": "def convert(lst):\n    ___\n", "solution": "def convert(lst):\n    if not lst:\n        return Link.empty\n    return Link(lst[0], convert(lst[1:]))\n", "tests": [{"s": "", "e": "convert([1, 2, 3])", "x": "Link(1, Link(2, Link(3)))"}, {"s": "", "e": "convert([1, [2, 3], 4])", "x": "Link(1, Link([2, 3], Link(4)))"}, {"s": "", "e": "convert([])", "x": "()"}], "note": ""}, {"id": "sp26-9a", "exam": "sp26", "n": "9a", "topic": "Orders of Growth", "title": "Off To The Races (a)", "kind": "mc", "points": 1, "prompt": "What is the order of growth of `remove_long_words1` with respect to the length of `links`?", "choices": ["constant", "logarithmic", "linear", "quadratic", "exponential"], "answer": [2], "multi": false, "explain": "One recursive call per link, each doing constant work.", "code": "def remove_long_words1(links, length):\n    if links is Link.empty:\n        return Link.empty\n    if len(links.first) >= length:\n        return remove_long_words1(links.rest, length)\n    return Link(links.first, remove_long_words1(links.rest, length))\n"}, {"id": "sp26-9b", "exam": "sp26", "n": "9b", "topic": "Orders of Growth", "title": "Off To The Races (b)", "kind": "mc", "points": 1, "prompt": "What is the order of growth of `remove_long_words2` with respect to the length of `links`?", "choices": ["constant", "logarithmic", "linear", "quadratic", "exponential"], "answer": [2], "multi": false, "explain": "Each link is visited a constant number of times across the two loops.", "code": "def remove_long_words2(links, length):\n    head = links\n    while head is not Link.empty and len(head.first) >= length:\n        head = head.rest\n    if head is Link.empty:\n        return Link.empty\n    prev = head\n    curr = head.rest\n    while curr is not Link.empty:\n        if len(curr.first) >= length:\n            prev.rest = curr.rest\n        else:\n            prev = curr\n        curr = curr.rest\n    return head\n"}, {"id": "sp26-9c", "exam": "sp26", "n": "9c", "topic": "Orders of Growth", "title": "Off To The Races (c)", "kind": "mc", "points": 1, "prompt": "Which of the two functions requires **more space** to run?", "choices": ["remove_long_words1", "remove_long_words2", "They require the same amount of space"], "answer": [0], "multi": false, "explain": "`remove_long_words1` is recursive, so it has Θ(n) frames on the call stack (and builds a new list), while `remove_long_words2` rearranges the existing links using a constant number of variables.", "code": ""}, {"id": "su15-1", "exam": "su15", "n": "1", "topic": "Object-Oriented Programming", "title": "Shut up and take my money", "kind": "wwpd", "points": 10, "prompt": "Write the output the interactive interpreter displays for each expression. If an error occurs write `Error`. Expressions run **in order** and earlier lines can affect later ones.", "code": "class Singer:\n    msg = 'Shut up and '\n    count = 1\n    lst = []\n    def __init__(self, name, x):\n        self.x = x\n    def sing(self):\n        Singer.count = Singer.count + 1\n        print(self.msg + self.x)\n        self.lst.append(self.count)\n\nclass Group(Singer):\n    def __init__(self, s1, s2):\n        self.s1 = s1\n        self.s2 = s2\n    def sing(self):\n        self.count = self.count + 1\n        self.s1.sing()\n        self.s2.sing()\n        self.s1.x, self.s2.x = self.s2.x, self.s1.x\n        self.lst.append(self.count)\n\nw_moon = Singer('WALK THE MOON', 'dance')\nrihanna = Singer('Rihanna', 'drive')\nw_ri = Group(w_moon, rihanna)\nw_ri.lst = []\n", "setup": "", "rows": [{"label": "w_moon.lst is w_ri.lst", "given": false, "answer": "False"}, {"label": "w_moon.sing()", "given": false, "answer": "Shut up and dance"}, {"label": "w_moon.count", "given": false, "answer": "2"}, {"label": "Group.count", "given": false, "answer": "2"}, {"label": "w_ri.s2.sing()", "given": false, "answer": "Shut up and drive"}, {"label": "w_ri.sing()", "given": false, "answer": "Shut up and dance\nShut up and drive"}, {"label": "Group.sing(w_moon)", "given": false, "answer": "Error"}, {"label": "Group.sing(w_ri)", "given": false, "answer": "Shut up and drive\nShut up and dance"}, {"label": "min(rihanna.lst, key=lambda x: -x)", "given": false, "answer": "7"}, {"label": "w_ri.lst", "given": false, "answer": "[4, 5]"}]}, {"id": "su15-2a", "exam": "su15", "n": "2a", "topic": "Environment Diagrams", "title": "Fly, you foos! (a)", "kind": "wwpd", "points": 7, "prompt": "Trace the program in your head (or on paper) as if you were drawing the environment diagram, then answer questions about the final state.", "code": "ex = [1, 3, 5]\n\ndef foo(x):\n    bar[x] = x\n    bar.append(len(bar))\n    return bar\n\nbar = [1, [2]]\n\nfoo(0)\nfoo(2)\nfoobar = bar[:]\nfoobar[1][0] = foobar\n", "setup": "", "rows": [{"label": "len(bar)", "given": false, "answer": "4"}, {"label": "bar[0]", "given": false, "answer": "0"}, {"label": "bar[2]", "given": false, "answer": "2"}, {"label": "bar[3]", "given": false, "answer": "3"}, {"label": "bar[1][0] is foobar", "given": false, "answer": "True"}, {"label": "foobar is bar", "given": false, "answer": "False"}, {"label": "bar[1] is foobar[1]", "given": false, "answer": "True"}, {"label": "How many local frames (f1, f2, ...) does the diagram need?", "given": false, "answer": "2"}]}, {"id": "su15-2b", "exam": "su15", "n": "2b", "topic": "Environment Diagrams", "title": "Fly, you foos! (b)", "kind": "wwpd", "points": 8, "prompt": "Trace the nonlocal rebinding carefully.", "code": "def foo(f):\n    def bar(x):\n        return f(x) + f(x)\n\n    def f(x):\n        nonlocal f\n        f = lambda x: x + 2\n        return x - 1\n\n    return bar\n\nresult = foo(lambda x: 2*x)(2)\n", "setup": "", "rows": [{"label": "result", "given": false, "answer": "5"}, {"label": "How many local frames (f1, f2, ...) does the diagram need?", "given": false, "answer": "4"}, {"label": "What does the first call f(x) inside bar return?", "given": false, "answer": "1"}, {"label": "What does the second call f(x) inside bar return?", "given": false, "answer": "4"}]}, {"id": "su15-3a", "exam": "su15", "n": "3a", "topic": "Object-Oriented Programming", "title": "Counter intuitive: __init__", "kind": "code", "points": 3, "prompt": "Implement the `__init__` method of `Counter`. The constructor takes a list of strings and stores a dictionary `counts` whose keys are the elements of the list and whose values are how many times each element appeared.\n\nThe exam allowed at most 5 extra lines.", "setup": "", "starter": "class Counter:\n    def __init__(self, lst):\n        self.counts = {}\n        ___\n", "solution": "class Counter:\n    def __init__(self, lst):\n        self.counts = {}\n        for x in lst:\n            if x in self.counts:\n                self.counts[x] += 1\n            else:\n                self.counts[x] = 1\n", "tests": [{"s": "dog = Counter(['this', 'is', 'spot', 'see', 'spot', 'run'])", "e": "dog.counts['this']", "x": "1"}, {"s": "", "e": "dog.counts['spot']", "x": "2"}, {"s": "", "e": "'catdog' in dog.counts", "x": "False"}, {"s": "", "e": "sorted(dog.counts.items())", "x": "[('is', 1), ('run', 1), ('see', 1), ('spot', 2), ('this', 1)]"}, {"s": "", "e": "Counter([]).counts", "x": "{}"}], "note": ""}, {"id": "su15-3b", "exam": "su15", "n": "3b", "topic": "Object-Oriented Programming", "title": "Counter intuitive: __getitem__", "kind": "code", "points": 2, "prompt": "Implement `__getitem__` so that `sappy['romeo']` works. A key that never appeared should give `0` instead of a `KeyError`. Assume `__init__` is correct.", "setup": "", "starter": "class Counter:\n    def __init__(self, lst):\n        self.counts = {}\n        for x in lst:\n            if x in self.counts:\n                self.counts[x] += 1\n            else:\n                self.counts[x] = 1\n\n    def __getitem__(self, key):\n        ___\n", "solution": "class Counter:\n    def __init__(self, lst):\n        self.counts = {}\n        for x in lst:\n            if x in self.counts:\n                self.counts[x] += 1\n            else:\n                self.counts[x] = 1\n\n    def __getitem__(self, key):\n        if key in self.counts:\n            return self.counts[key]\n        return 0\n", "tests": [{"s": "hamlet = Counter(['to', 'be', 'or', 'not', 'to', 'be'])", "e": "hamlet['be']", "x": "2"}, {"s": "", "e": "hamlet['not']", "x": "1"}, {"s": "", "e": "hamlet['whiny']", "x": "0"}, {"s": "", "e": "hamlet['to']", "x": "2"}], "note": ""}, {"id": "su15-4a", "exam": "su15", "n": "4a", "topic": "Trees", "title": "Trees? What a reLEAF!", "kind": "code", "points": 4, "prompt": "Implement `find_and_replace(t, old, new)`. It **mutates** `t` so every entry equal to `old` is replaced with `new`. This exam uses a `Tree` with `entry` and `subtrees` attributes.", "setup": "class Tree:\n    def __init__(self, entry, subtrees=[]):\n        self.entry = entry\n        self.subtrees = list(subtrees)\n    def is_leaf(self):\n        return not self.subtrees\n    def __repr__(self):\n        if self.subtrees:\n            return 'Tree({0}, {1})'.format(repr(self.entry), repr(self.subtrees))\n        return 'Tree({0})'.format(repr(self.entry))\n", "starter": "def find_and_replace(t, old, new):\n    ___\n", "solution": "def find_and_replace(t, old, new):\n    if t.entry == old:\n        t.entry = new\n    for s in t.subtrees:\n        find_and_replace(s, old, new)\n", "tests": [{"s": "t = Tree(3, [Tree(1, [Tree(3), Tree(8, [Tree(6)])]), Tree(5), Tree(3, [Tree(2)])])\nfind_and_replace(t, 3, 42)", "e": "t", "x": "Tree(42, [Tree(1, [Tree(42), Tree(8, [Tree(6)])]), Tree(5), Tree(42, [Tree(2)])])"}, {"s": "t = Tree(7, [Tree(7)])\nfind_and_replace(t, 5, 0)", "e": "t", "x": "Tree(7, [Tree(7)])"}, {"s": "t = Tree(1, [Tree(2, [Tree(1)])])\nfind_and_replace(t, 1, 9)", "e": "t", "x": "Tree(9, [Tree(2, [Tree(9)])])"}], "note": ""}, {"id": "su15-4b", "exam": "su15", "n": "4b", "topic": "Trees", "title": "Is it a binary search tree?", "kind": "code", "points": 3, "prompt": "Implement `is_bst(b)`, which returns `True` if the `BinaryTree` `b` is a valid binary search tree. An empty tree is valid. You may use `tree_max` and `tree_min` (non-empty trees only).", "setup": "class BinaryTree:\n    empty = ()\n    def __init__(self, entry, left=empty, right=empty):\n        self.entry = entry\n        self.left = left\n        self.right = right\ndef tree_max(b):\n    \"\"\"Returns the largest element in a non-empty BinaryTree.\"\"\"\n    m = b.entry\n    if b.left != BinaryTree.empty:\n        m = max(m, function guardLoops(src){

}

  var c = counts(QS);
  var hero = el('div', {class:'hero'});
  hero.innerHTML = '<h1>Every CS\u00a061A <span class="hl">Midterm\u00a02</span>, runnable.</h1><p>' + QS.length + ' questions from ' + EXAMS.length + ' past exams. Fill the blanks or write the code, press Run, and see exactly which tests pass. Everything runs in your browser and your progress is saved on this device.</p>';
  main.appendChild(hero);
  main.appendChild(el('div', {class:'how'},
    el('div', null, el('b', {text:'1 \u00b7 Pick'}), el('span', {text:'An exam or a topic from the sidebar. Each question has a topic heading.'})),
    el('div', null, el('b', {text:'2 \u00b7 Fill in'}), el('span', {text:'Replace each gold ___ blank, or write the whole function. Predict-the-output questions take typed answers.'})),
    el('div', null, el('b', {text:'3 \u00b7 Run'}), el('span', {text:'Your code runs against test cases, with expected and actual output side by side.'}))));
  main.appendChild(el('h2', {class:'sec', text:'Exams'}));
  var ul = el('ul', {class:'exam-list'});
  EXAMS.forEach(function(e){
    var qs = examQs(e.id), cc = counts(qs);
    var topics = []; qs.forEach(function(q){ if (topics.indexOf(q.topic) < 0) topics.push(q.topic); });
    ul.appendChild(el('li', null, el('a', {href:'#/exam/' + e.id}, el('span', {class:'nm', text:e.name}), el('span', {class:'tp', text:topics.slice(0, 4).join(' \u00b7 ')}), el('span', {class:'pr', text:cc[0] + ' / ' + cc[1] + ' done'}))));
  });
  main.appendChild(ul);
  main.appendChild(el('h2', {class:'sec', text:'Topics'}));
  var ch = el('div', {class:'chips'});
  topicNames.forEach(function(t){ ch.appendChild(el('a', {class:'chip', href:'#/topic/' + encodeURIComponent(t)}, el('span', {class:'dot', style:'--c:' + HUES[t]}), t, el('em', {text:TOPICS[t].length}))); });
  main.appendChild(ch);
}
function pageList(title, sub, qs, showExam, groupByTopic){
  main.innerHTML = '';
  var c = counts(qs);
  main.appendChild(el('div', {class:'page-head'}, el('h1', {text:title}), el('p', {text: sub + ' \u00b7 ' + c[0] + ' of ' + c[1] + ' done'})));
  if (!qs.length){ main.appendChild(el('div', {class:'empty', text:'Nothing matches.'})); return; }
  if (groupByTopic){
    var last = null, sec = null;
    qs.forEach(function(q){
      if (q.topic !== last){ sec = el('div', {class:'topic-sec'}, el('h2', {class:'topic-h', text:q.topic})); main.appendChild(sec); last = q.topic; }
      sec.appendChild(renderQuestion(q, showExam));
    });
  } else {
    qs.forEach(function(q){ main.appendChild(renderQuestion(q, showExam)); });
  }
}
function route(){
  var h = location.hash.replace(/^#\/?/, '').split('/'); currentRoute = h[0] ? [h[0], decodeURIComponent(h.slice(1).join('/'))] : null;
  closeSide();
  if (currentRoute && currentRoute[0] === 'exam' && examName[currentRoute[1]]){
    store.mode = 'exam';
    pageList(examName[currentRoute[1]] + ' Midterm 2', 'Questions in exam order, each under its topic', examQs(currentRoute[1]), false, false);
  } else if (currentRoute && currentRoute[0] === 'topic' && TOPICS[currentRoute[1]]){
    store.mode = 'topic';
    var qs = TOPICS[currentRoute[1]].slice().sort(function(a, b){ return EXAMS.findIndex(function(e){ return e.id === a.exam; }) - EXAMS.findIndex(function(e){ return e.id === b.exam; }); });
    pageList(currentRoute[1], 'Every question on this topic, newest exam first', qs, true, false);
  } else if (currentRoute && currentRoute[0] === 'search'){
    var term = currentRoute[1].toLowerCase();
    var res = QS.filter(function(q){ return (q.title + ' ' + q.topic + ' ' + q.prompt + ' ' + examName[q.exam]).toLowerCase().indexOf(term) >= 0; });
    pageList('Search: \u201c' + currentRoute[1] + '\u201d', res.length + ' matching question' + (res.length === 1 ? '' : 's'), res, true, false);
  } else { currentRoute = null; pageHome(); }
  refresh(); window.scrollTo(0, 0);
}
window.addEventListener('hashchange', route);
document.getElementById('seg-exam').addEventListener('click', function(){ store.mode = 'exam'; save(); buildNav(currentRoute); });
document.getElementById('seg-topic').addEventListener('click', function(){ store.mode = 'topic'; save(); buildNav(currentRoute); });
var searchEl = document.getElementById('search'), st = null;
searchEl.addEventListener('input', function(){ clearTimeout(st); st = setTimeout(function(){ var v = searchEl.value.trim(); if (v) location.hash = '#/search/' + encodeURIComponent(v); else if (currentRoute && currentRoute[0] === 'search') location.hash = '#/'; }, 250); });

/* side drawer + theme */
var side = document.getElementById('side'), scrim = document.getElementById('scrim'), menuBtn = document.getElementById('menu-btn');
function closeSide(){ side.classList.remove('open'); scrim.classList.remove('on'); menuBtn.setAttribute('aria-expanded', 'false'); }
menuBtn.addEventListener('click', function(){ var o = side.classList.toggle('open'); scrim.classList.toggle('on', o); menuBtn.setAttribute('aria-expanded', String(o)); });
scrim.addEventListener('click', closeSide);
function applyTheme(){ if (store.theme) document.documentElement.setAttribute('data-theme', store.theme); }
document.getElementById('theme-btn').addEventListener('click', function(){
  var dark = document.documentElement.getAttribute('data-theme') === 'dark' || (!store.theme && window.matchMedia('(prefers-color-scheme: dark)').matches);
  store.theme = dark ? 'light' : 'dark'; save(); applyTheme();
});
applyTheme();
route();
loadPy();
})();
</script>
